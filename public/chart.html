<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>تداول+</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#070b12;font-family:'Cairo',sans-serif;direction:rtl}
#hdr{width:100%;background:#070a12;border-bottom:1px solid #0f1520;position:relative;z-index:10}
#r1{display:flex;align-items:center;padding:8px 10px;gap:8px;min-height:52px;border-bottom:1px solid rgba(255,255,255,0.03)}
#r2{display:flex;align-items:center;padding:6px 10px 7px;gap:5px;overflow-x:auto;scrollbar-width:none;background:#0d1120;flex-wrap:nowrap;border-top:1px solid #1a2235}
#r2::-webkit-scrollbar{display:none}
#chart-wrap{position:absolute;left:0;right:0;bottom:0;overflow:visible}
canvas{display:block;touch-action:none;cursor:crosshair}
button{font-family:'Cairo',sans-serif;cursor:pointer;outline:none}
.btn{display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent;border-radius:9px;padding:5px 9px;color:#3a4560;font-size:11px;white-space:nowrap;flex-shrink:0}
.ibtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#1a2235;border:1px solid #2a3a55;border-radius:12px;cursor:pointer;padding:7px 5px 6px;min-width:52px;height:54px;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.ibtn svg{width:22px;height:17px;flex-shrink:0;}
.ibtn span{font-size:9.5px;font-family:Cairo,sans-serif;color:#7090b0;line-height:1;white-space:nowrap;}
.ibtn:active{opacity:0.7;}
.ibtn.active{background:#0d2040;border-color:#3b9eff;}
.ibtn.active svg line,.ibtn.active svg polyline,.ibtn.active svg path,.ibtn.active svg rect,.ibtn.active svg circle,.ibtn.active svg polygon{stroke:#3b9eff !important;}
.ibtn.active span{color:#3b9eff;}
.ibtn-sm{min-width:36px;}
.ibtn-sm svg{width:19px;}
.btn.active{border-color:var(--c,#3b9eff)40;background:var(--c,#3b9eff)12;color:var(--c,#3b9eff)}
.sep{width:1px;height:20px;background:#141824;flex-shrink:0;margin:0 2px}
#per-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:5px 11px;color:#ccd4ee;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:4px}
#per-btn.open{border-color:rgba(59,158,255,0.4);background:rgba(59,158,255,0.12);color:#3b9eff}
#per-menu{position:fixed;background:#08101c;border:1px solid #1e2d42;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,0.9);padding:8px;display:none;flex-wrap:wrap;gap:4px;width:188px;z-index:999}
#per-menu.open{display:flex}
.pmenu-item{flex:1;min-width:46px;text-align:center;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 4px;color:#4a5570;font-size:12px;font-weight:600}
.pmenu-item.active{color:#3b9eff;background:rgba(59,158,255,0.14);border-color:rgba(59,158,255,0.3);font-weight:700}
#ct-menu{position:fixed;background:#08101c;border:1px solid #1e2d42;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,0.9);padding:6px;display:none;flex-direction:column;gap:2px;min-width:130px;z-index:999}
#ct-menu.open{display:flex}
.ctitem{background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 14px;color:#4a5570;font-size:12px;text-align:right;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctitem.active{color:#3b9eff;background:rgba(59,158,255,0.12);border-color:rgba(59,158,255,0.25);font-weight:700}
#badge{background:#081728;border:1.5px solid #0f3860;border-radius:7px;padding:3px 8px 4px;display:inline-flex;flex-direction:column;align-items:center;min-width:42px;cursor:pointer}
#sym-code{font-size:12px;font-weight:900;color:#4ab0ff;line-height:1.15}
#sym-sar{font-size:7px;color:#0e3560;letter-spacing:.7px}
#stk-name{font-size:15px;font-weight:700;color:#e8ecf4;cursor:pointer;margin-right:8px}
#pw{margin-right:auto;display:flex;align-items:center;gap:7px;direction:ltr}
#pmain{font-size:22px;font-weight:900;color:#fff;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#pch{font-size:12px;font-weight:700}
#ppct{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;border:1px solid}
/* Sheets */
#sbg{position:fixed;inset:0;background:rgba(3,6,12,0.75);z-index:100;display:none;pointer-events:none}
#sbg.show{display:block;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#080d1a;border-radius:18px 18px 0 0;border:1px solid #141824;max-height:85vh;display:flex;flex-direction:column;z-index:101;transform:translateY(100%);transition:transform .25s ease;pointer-events:none}
.sheet.show{transform:translateY(0);pointer-events:auto}
.sh{width:36px;height:4px;background:#1a2030;border-radius:2px;margin:12px auto 4px}
.shdr{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 10px}
.stit{font-size:14px;font-weight:800;color:#edf1f8}
.scls{background:none;border:none;color:#ef4444;font-size:11px}
.sbody{overflow-y:auto;flex:1}
.sfoot{padding:10px 12px;border-top:1px solid #141824;flex-shrink:0;display:flex;gap:8px}
.fbtn{flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:700;border-width:1px;border-style:solid}
/* Indicators */
.icat{padding:7px 16px;background:#050910;font-size:9px;font-weight:700;color:#3a4060;letter-spacing:.7px}
.irow{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid #0c1020;cursor:pointer;background:transparent;width:100%;border-left:none;border-right:none;border-top:none}
.ichk{width:22px;height:22px;border-radius:6px;background:#0c1020;border:1px solid #141828;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.idot{width:3px;height:14px;border-radius:2px;margin-right:8px;flex-shrink:0}
.ilbl{font-size:12px;color:#7a8298}
/* Stocks */
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #0c1020;cursor:pointer;background:transparent;width:100%;border-left:none;border-right:none;border-top:none}
/* Draw cats */
.dcat{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #0d1420;cursor:pointer;background:transparent;width:100%;border-left:none;border-right:none;border-top:none}
.dcat-t{font-size:14px;color:#c8d4e8;font-weight:500}
.dcat-a{font-size:12px;color:#3a4560;transition:transform .2s}
.dcat.open .dcat-a{transform:rotate(90deg)}
.ditems{display:none;flex-direction:column;background:#050910}
.ditems.open{display:flex}
.dtool{display:flex;align-items:center;justify-content:space-between;padding:11px 20px 11px 16px;border-bottom:1px solid #0a1018;cursor:pointer;background:transparent;width:100%;border-left:none;border-right:none;border-top:none;gap:10px}
.dtool.active{background:rgba(59,158,255,0.1)}
.dtool-l{display:flex;align-items:center;gap:10px}
.dtool-ic{font-size:16px;width:24px;text-align:center;flex-shrink:0}
.dtool-n{font-size:12px;color:#8a9ab8}
.dtool.active .dtool-n{color:#3b9eff;font-weight:700}
/* AI panel */
#aip{position:fixed;inset:0;background:rgba(4,7,14,0.97);z-index:200;display:none;flex-direction:column;pointer-events:none}
#aip.show{display:flex;pointer-events:auto}
.aic{background:#080d18;border-radius:10px;border:1px solid #141824;overflow:hidden;margin-bottom:6px}
.aich{padding:7px 12px;border-bottom:1px solid #141824;background:#060a14;font-size:9px;font-weight:700;color:#3a4060}
.aib{padding:10px 12px}
/* Toast */
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(5,12,20,0.95);border:1px solid rgba(29,184,138,0.4);border-radius:10px;padding:7px 16px;color:#1db88a;font-size:12px;pointer-events:none;display:none;z-index:5;white-space:nowrap}
#toast.show{display:block}
/* Draw ctx menu */
#dctx{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:36px;height:36px;border:3px solid rgba(167,139,250,0.2);border-top:3px solid #a78bfa;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
/* Draw menu buttons */
#dtb button:active{opacity:0.7;transform:scale(0.95)}
#dtb-color-btn:active{transform:scale(0.92)}
#draw-color-swatches button:hover{transform:scale(1.2)}
#draw-color-swatches button:active{transform:scale(0.9)}

/* ── Landscape / iPad Optimization ── */
@media (orientation: landscape) and (max-height: 500px) {
  #r1 { min-height: 38px !important; padding: 4px 10px !important; }
  #r1 #pmain { font-size: 16px !important; }
  #r1 #stk-name { font-size: 12px !important; }
  #r2 { padding: 3px 8px 4px !important; }
  .ibtn { height: 42px !important; min-width: 44px !important; padding: 4px 3px 4px !important; }
  .ibtn svg { width: 18px !important; height: 14px !important; }
  .ibtn span { font-size: 8px !important; }
  #btn-theme { width: 36px !important; height: 36px !important; }
}
@media (min-width: 768px) {
  /* iPad portrait/landscape */
  .ibtn { min-width: 64px !important; height: 62px !important; padding: 9px 8px 8px !important; }
  .ibtn svg { width: 26px !important; height: 20px !important; }
  .ibtn span { font-size: 11px !important; }
  #r1 #pmain { font-size: 26px !important; }
  #r1 #stk-name { font-size: 18px !important; }
  #r2 { gap: 8px !important; padding: 8px 14px 9px !important; }
  #per-btn { height: 62px !important; padding: 0 18px !important; font-size: 15px !important; }
  #btn-theme { width: 54px !important; height: 54px !important; border-radius: 14px !important; }
  #badge { padding: 5px 10px !important; border-radius: 10px !important; }
  #sym-code { font-size: 15px !important; }
}

 @keyframes wavePopIn {
  from { opacity:0; transform:scale(0.85) translateY(6px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
 }
 @keyframes obPulse {
  0%,100% { box-shadow: 0 0 0 4px rgba(59,158,255,0.25), 0 0 20px rgba(59,158,255,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(59,158,255,0.1), 0 0 30px rgba(59,158,255,0.6); }
 }
 @keyframes chartSpin {
  to { transform: rotate(360deg); }
 }
 #chart-loader.visible {
  opacity: 1 !important;
  pointer-events: auto !important;
 }
</style>
</head>
<body>
<div id="hdr">
 <div id="r1">
<button onclick="window.parent.postMessage('closeChart','*')" style="background:#1a2235;border:1px solid #2a3a55;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex-shrink:0;touch-action:manipulation;color:#f0f6ff;font-size:16px;-webkit-tap-highlight-color:transparent;margin-left:8px;">✕</button>
<div id="badge" onclick="openSheet('stock')">
  <span id="sym-code">2010</span>
  <span id="sym-sar">SAR</span>
</div>

 <span id="stk-name" onclick="openSheet('stock')">سابك</span>
 <div id="pw">
  <span id="pmain">103.20</span>
  <span id="pch">+2.46</span>
  <span id="ppct">+2.38%</span>
 </div>
 <button id="btn-theme"  style="background:#1a2235;border:1px solid #2a3a55;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin-right:auto;-webkit-tap-highlight-color:transparent;flex-shrink:0;touch-action:manipulation;" title="السمة">
  <svg id="theme-icon" viewBox="0 0 24 24" fill="none" width="22" height="22">
    <!-- Moon: crescent shape -->
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="#a5b4fc" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
</div>
<div id="cam-menu" style="display:none;position:fixed;background:rgba(6,10,22,0.97);border:1px solid rgba(255,255,255,0.12);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.95);padding:8px;z-index:9999;min-width:230px;">

 <!-- PNG -->
 <div style="display:flex;align-items:center;gap:4px">
  <button onclick="doSnap();closeCamMenu()" style="flex:1;background:transparent;border:none;padding:10px 14px;color:#c0d0e8;font-size:13px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:9px;box-sizing:border-box;display:flex;align-items:center;gap:8px;direction:rtl"><span style="font-size:15px">📸</span>تصدير PNG</button>
  <button onclick="showCamHelp('png')" style="width:22px;height:22px;border-radius:50%;background:rgba(59,158,255,0.1);border:1px solid rgba(59,158,255,0.2);color:#3b9eff;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:6px;padding:0">?</button>
 </div>

 <div style="height:1px;background:rgba(255,255,255,0.06);margin:3px 6px"></div>

 <!-- حفظ (موحّد) -->
 <div style="display:flex;align-items:center;gap:4px">
  <button onclick="toggleCamSub('sub-save')" style="flex:1;background:transparent;border:none;padding:10px 14px;color:#c0d0e8;font-size:13px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:9px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;direction:rtl"><span style="display:flex;align-items:center;gap:8px"><span style="font-size:15px">💾</span>حفظ</span><span id="arrow-save" style="font-size:9px;color:#4a6080;transition:transform 0.2s">▾</span></button>
  <button onclick="showCamHelp('save')" style="width:22px;height:22px;border-radius:50%;background:rgba(59,158,255,0.1);border:1px solid rgba(59,158,255,0.2);color:#3b9eff;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:6px;padding:0">?</button>
 </div>
 <div id="sub-save" style="display:none;margin:0 6px 4px;border-right:2px solid rgba(167,139,250,0.2);padding-right:8px">
  <button onclick="exportDrawings();closeCamMenu()" style="width:100%;background:transparent;border:none;padding:7px 10px;color:#94a3b8;font-size:11px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:7px;display:flex;align-items:center;gap:6px;direction:rtl"><span>☁</span>رسومات JSON</button>
  <button onclick="saveTemplate();closeCamMenu()" style="width:100%;background:transparent;border:none;padding:7px 10px;color:#94a3b8;font-size:11px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:7px;display:flex;align-items:center;gap:6px;direction:rtl"><span>🗂</span>قالب المؤشرات</button>
 </div>

 <!-- استيراد (موحّد) -->
 <div style="display:flex;align-items:center;gap:4px">
  <button onclick="toggleCamSub('sub-load')" style="flex:1;background:transparent;border:none;padding:10px 14px;color:#c0d0e8;font-size:13px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:9px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;direction:rtl"><span style="display:flex;align-items:center;gap:8px"><span style="font-size:15px">📂</span>استيراد</span><span id="arrow-load" style="font-size:9px;color:#4a6080;transition:transform 0.2s">▾</span></button>
  <button onclick="showCamHelp('import')" style="width:22px;height:22px;border-radius:50%;background:rgba(59,158,255,0.1);border:1px solid rgba(59,158,255,0.2);color:#3b9eff;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:6px;padding:0">?</button>
 </div>
 <div id="sub-load" style="display:none;margin:0 6px 4px;border-right:2px solid rgba(167,139,250,0.2);padding-right:8px">
  <button onclick="importDrawings();closeCamMenu()" style="width:100%;background:transparent;border:none;padding:7px 10px;color:#94a3b8;font-size:11px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:7px;display:flex;align-items:center;gap:6px;direction:rtl"><span>📥</span>رسومات JSON</button>
  <button onclick="loadTemplateMenu();closeCamMenu()" style="width:100%;background:transparent;border:none;padding:7px 10px;color:#94a3b8;font-size:11px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:7px;display:flex;align-items:center;gap:6px;direction:rtl"><span>📋</span>قالب المؤشرات</button>
 </div>

 <div style="height:1px;background:rgba(255,255,255,0.06);margin:3px 6px"></div>

 <!-- مشاركة -->
 <div style="display:flex;align-items:center;gap:4px">
  <button onclick="shareChart();closeCamMenu()" style="flex:1;background:transparent;border:none;padding:10px 14px;color:#3b9eff;font-size:13px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:9px;box-sizing:border-box;display:flex;align-items:center;gap:8px;direction:rtl"><span style="font-size:15px">🔗</span>مشاركة رابط</button>
  <button onclick="showCamHelp('share')" style="width:22px;height:22px;border-radius:50%;background:rgba(59,158,255,0.1);border:1px solid rgba(59,158,255,0.2);color:#3b9eff;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:6px;padding:0">?</button>
 </div>

</div>
 <div id="r2">
  <!-- Period selector (keep small) -->
  <button id="per-btn" onclick="togglePerMenu()" style="background:#1a2235;border:1px solid #2a3a55;border-radius:12px;color:#c0d0e8;font-size:13px;font-weight:700;padding:0 14px;height:54px;cursor:pointer;font-family:Cairo,sans-serif;flex-shrink:0">1D</button>
<button id="range-btn" onclick="toggleRangeMenu()" style="background:#1a2235;border:1px solid #2a3a55;border-radius:12px;color:#7a90b0;font-size:13px;font-weight:700;padding:0 14px;height:54px;cursor:pointer;font-family:Cairo,sans-serif;flex-shrink:0">سنة</button>
  <!-- Icon buttons row -->
  <div class="sep"></div>

  <!-- Chart Type -->
<button id="ct-btn" class="ibtn" onclick="toggleCtMenu()" title="نوع الشارت">
    <svg viewBox="0 0 28 20" fill="none"><line x1="7" y1="2" x2="7" y2="6" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round"/><rect x="4.5" y="6" width="5" height="8" rx="0.8" stroke="#5eead4" stroke-width="1.4" fill="none"/><line x1="7" y1="14" x2="7" y2="18" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round"/><line x1="17" y1="1" x2="17" y2="6" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round"/><rect x="14.5" y="6" width="5" height="9" rx="0.8" fill="#5eead4" opacity="0.9"/><line x1="17" y1="15" x2="17" y2="19" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span></span>
  </button>

  <!-- Indicators -->
  <button id="btn-ind" class="ibtn" onclick="openSheet('ind');setTimeout(()=>{const b=document.getElementById('btn-of-sheet');if(b){b.style.background=showOrderFlow?'rgba(34,197,94,0.15)':'rgba(255,255,255,0.05)';b.style.borderColor=showOrderFlow?'rgba(34,197,94,0.4)':'rgba(255,255,255,0.1)';b.style.color=showOrderFlow?'#22c55e':'#94a3b8';}},50)" title="مؤشرات">
    <svg viewBox="0 0 28 20" fill="none"><polyline points="2,16 8,8 14,11 20,4 26,6" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 4 L26 4 L26 8" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>مؤشرات<i id="ind-n" style="background:#3b9eff;color:#000;border-radius:8px;font-size:7px;font-weight:900;padding:0 4px;display:none;font-style:normal;margin-right:2px">0</i></span>
  </button>

  <!-- Strategies -->
  <button id="btn-strat" class="ibtn" onclick="openSheet('strat')" title="استراتيجيات">
    <svg viewBox="0 0 28 20" fill="none"><line x1="4" y1="6" x2="24" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="11" x2="24" y2="11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="16" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>استراتيجيات</span>
  </button>

  <!-- Draw -->
  <button id="btn-draw" class="ibtn" onclick="openSheet('draw')" title="رسم">
    <svg viewBox="0 0 28 22" fill="none"><path d="M5 17 L10 7 L18 14 L23 5" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="7" r="1.5" fill="#94a3b8"/><circle cx="18" cy="14" r="1.5" fill="#94a3b8"/></svg>
    <span>رسم<i id="draw-badge" style="background:#3b9eff;color:#000;border-radius:8px;font-size:7px;font-weight:900;padding:0 4px;display:none;font-style:normal;margin-right:2px">0</i></span>

   if(_t2){al.fired=true;const _lbl='MA9/MA21 '+(al.condition==='cross_up'?'تقاطع صعودي ↑':'تقاطع هبوطي ↓');sendNotif('تنبيه',_lbl);const _t=document.getElementById('toast');if(_t){_t.textContent='⬤ '+_lbl;_t.style.display='block';_t.classList.add('show');setTimeout(()=>{_t.classList.remove('show');_t.style.display='none';},3000);}setTimeout(()=>{al.fired=false;},2000);}
   return;
  }
  else if(al.indId === 'PRICE_MA'){
   const _m50=_indCache.results?.ma50;
   if(!_m50)return;
   const _pc=all[last]?.c,_pp=all[last-1]?.c,_m50c=_m50[last],_m50p=_m50[last-1];
   if(_pc==null||_pp==null||_m50c==null||_m50p==null)return;
   const _t3=(al.condition==='cross_up'&&_pp<=_m50p&&_pc>_m50c)||(al.condition==='cross_dn'&&_pp>=_m50p&&_pc<_m50c);
   if(_t3){al.fired=true;const _lbl='السعر '+(al.condition==='cross_up'?'تجاوز MA50 ↑':'هبط تحت MA50 ↓');sendNotif('تنبيه',_lbl);const _t=document.getElementById('toast');if(_t){_t.textContent='⬤ '+_lbl;_t.style.display='block';_t.classList.add('show');setTimeout(()=>{_t.classList.remove('show');_t.style.display='none';},3000);}setTimeout(()=>{al.fired=false;},2000);}
   return;
  }

  if(curVal == null) return;
  al._prev = curVal;

  const triggered =
   al.condition === 'above'   ? prev != null && prev <= al.value && curVal > al.value :
   al.condition === 'below'   ? prev != null && prev >= al.value && curVal < al.value :
   al.condition === 'cross_up'? prev != null && prev < 0 && curVal >= 0 :
   al.condition === 'cross_dn'? prev != null && prev > 0 && curVal <= 0 : false;

  if(triggered){
   al.fired = true;
   const lbl = al.indId + (al.condition.includes('cross') ? ' تقاطع' : (al.condition==='above'?' فوق ':' تحت ')+al.value);

   // Auto-reset after 1 candle to allow re-triggering
   setTimeout(()=>{al.fired=false;}, 2000);
  }
 });
}

// Safe formula evaluator — sandboxed, only math + indicator functions
function _evalCustomInd(formula, allC, allH, allL, allV){
 try {
  // Build sandbox with available data + functions
  const _sandbox = {
   close: allC, high: allH, low: allL, volume: allV,
   // Math helpers
   abs: Math.abs, max: Math.max, min: Math.min,
   sqrt: Math.sqrt, pow: Math.pow, log: Math.log,
   // Indicator functions (all return arrays same length as input)
   SMA: (src,n)=>sma(src,n),
   EMA: (src,n)=>ema(src,n),
   RSI: (src,n=14)=>rsi(src,n),
   BB:  (src,n=20,k=2)=>bb(src,n,k),
   ATR: (n=14)=>calcATR_data({map:(fn)=>allC.map((_,i)=>({c:allC[i],hi:allH[i],lo:allL[i]}))},n),
   OBV: ()=>obv(allC,allV),
   MACD:(src,f=12,s=26,sg=9)=>macd(src,f,s,sg),
   // Arithmetic on arrays
   ADD: (a,b)=>a.map((v,i)=>v==null||b[i]==null?null:v+b[i]),
   SUB: (a,b)=>a.map((v,i)=>v==null||b[i]==null?null:v-b[i]),
   MUL: (a,b)=>a.map((v,i)=>v==null||b[i]==null?null:v*b[i]),
   DIV: (a,b)=>a.map((v,i)=>v==null||b[i]==null||b[i]===0?null:v/b[i]),
   // Scalar operations
   ADDK: (a,k)=>a.map(v=>v==null?null:v+k),
   MULK: (a,k)=>a.map(v=>v==null?null:v*k),
   // Shift array
   SHIFT: (a,n)=>a.map((_,i)=>i<n?null:a[i-n]),
   // Cross detection (returns 1 on cross up, -1 on cross down, 0 otherwise)
   CROSS: (a,b)=>a.map((_,i)=>{
    if(i===0||a[i]==null||b[i]==null||a[i-1]==null||b[i-1]==null)return 0;
    if(a[i-1]<=b[i-1]&&a[i]>b[i])return 1;
    if(a[i-1]>=b[i-1]&&a[i]<b[i])return -1;
    return 0;
   }),
   // Clamp array values
   CLAMP: (a,mn,mx)=>a.map(v=>v==null?null:Math.max(mn,Math.min(mx,v))),
   // Number of candles
   N: allC.length,
   // Derived price sources
   hl2: allH.map((h,i)=>(h+allL[i])/2),
   hlc3: allH.map((h,i)=>(h+allL[i]+allC[i])/3),
   ohlc4: allH.map((h,i)=>(allC[i-1]??allC[i]+h+allL[i]+allC[i])/4),
   // More MA types
   WMA: (src,n)=>src.map((_,i)=>i<n-1?null:src.slice(i-n+1,i+1).reduce((s,v,j)=>s+v*(j+1),0)/(n*(n+1)/2)),
   DEMA: (src,n)=>{const e1=ema(src,n);const e2=ema(e1,n);return e1.map((v,i)=>v==null||e2[i]==null?null:2*v-e2[i]);},
   TEMA: (src,n)=>{const e1=ema(src,n);const e2=ema(e1,n);const e3=ema(e2,n);return e1.map((v,i)=>v==null||e2[i]==null||e3[i]==null?null:3*v-3*e2[i]+e3[i]);},
   HULL: (src,n)=>{const w=Math.round(Math.sqrt(n));const h=ema(src.map((_,i)=>i<n-1?null:2*(ema(src,Math.floor(n/2))[i]??0)-(ema(src,n)[i]??0)),w);return h;},
   // Momentum indicators
   MOM: (src,n=10)=>src.map((v,i)=>i<n||v==null||src[i-n]==null?null:v-src[i-n]),
   ROC: (src,n=10)=>src.map((v,i)=>i<n||v==null||src[i-n]==null||src[i-n]===0?null:(v-src[i-n])/src[i-n]*100),
   CCI: (n=20)=>{const tp=allH.map((h,i)=>(h+allL[i]+allC[i])/3);return tp.map((_,i)=>{if(i<n-1)return null;const sl=tp.slice(i-n+1,i+1);const m=sl.reduce((a,b)=>a+b,0)/n;const d=sl.reduce((a,v)=>a+Math.abs(v-m),0)/n;return d===0?0:(tp[i]-m)/(0.015*d);});},
   CMO: (src,n=14)=>src.map((_,i)=>{if(i<n)return null;let u=0,d=0;for(let k=i-n+1;k<=i;k++){const diff=src[k]-(src[k-1]??src[k]);diff>0?u+=diff:d-=diff;}return u+d===0?0:(u-d)/(u+d)*100;}),
   // Volume indicators
   CMF: (n=20)=>{const mf=allH.map((h,i)=>{const r=h-allL[i]||0.001;return((allC[i]-allL[i])-(h-allC[i]))/r*allV[i];});return mf.map((_,i)=>{if(i<n-1)return null;const sv=allV.slice(i-n+1,i+1).reduce((a,b)=>a+b,0);return sv===0?0:mf.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/sv;});},
   // Statistical
   STDEV: (src,n=20)=>src.map((_,i)=>{if(i<n-1)return null;const sl=src.slice(i-n+1,i+1).filter(v=>v!=null);const m=sl.reduce((a,b)=>a+b,0)/sl.length;return Math.sqrt(sl.reduce((a,v)=>a+(v-m)**2,0)/sl.length);}),
   HIGHEST: (src,n=20)=>src.map((_,i)=>i<n-1?null:Math.max(...src.slice(i-n+1,i+1).filter(v=>v!=null))),
   LOWEST: (src,n=20)=>src.map((_,i)=>i<n-1?null:Math.min(...src.slice(i-n+1,i+1).filter(v=>v!=null))),
   ABS: (a)=>Array.isArray(a)?a.map(v=>v==null?null:Math.abs(v)):Math.abs(a),
   SQRT: (a)=>Array.isArray(a)?a.map(v=>v==null?null:Math.sqrt(Math.abs(v))):Math.sqrt(Math.abs(a)),
   MAX: (a,b)=>Array.isArray(a)?a.map((v,i)=>v==null||(Array.isArray(b)&&b[i]==null)?null:Math.max(v,Array.isArray(b)?b[i]:b)):Math.max(a,b),
   MIN: (a,b)=>Array.isArray(a)?a.map((v,i)=>v==null||(Array.isArray(b)&&b[i]==null)?null:Math.min(v,Array.isArray(b)?b[i]:b)):Math.min(a,b),
   // Number of candles
   N: allC.length,
  };

  // Build function from formula
  // ── Security: blacklist dangerous patterns ──
  const dangerousPatterns = /\b(fetch|XMLHttpRequest|import|eval|Function|require|process|window|document|globalThis|self|parent|top|location|navigator|localStorage|sessionStorage|indexedDB|cookie|alert|prompt|confirm|setTimeout|setInterval|Worker|postMessage|FileReader|Blob)\b/i;
  if(dangerousPatterns.test(formula)) return null;
  // Limit formula length
  if(formula.length > 500) return null;
  
  const keys = Object.keys(_sandbox);
  const vals = Object.keys(_sandbox).map(k=>_sandbox[k]);
  const fn = new Function(...keys, `"use strict"; return (${formula});`);
  const result = fn(...vals);

  // Result must be an array
  if(!Array.isArray(result)) return null;
  return result;
 } catch(e) {
  return null; // silent fail
 }
}

// Store Elliott wave dots for tap detection
let _elliottDots = []; // [{x, y, waveKey, price, idx}]
// ── Panel Resize System ──────────────────────────────
// Stores custom heights as % of chart H
// Keys: 'vol' for volume, 'sub_0','sub_1',... for indicator panels
let panelSizes = {}; // e.g. {vol:0.14, sub_0:0.18, sub_1:0.14}
let panelYZoom = {}; // Y-axis zoom per panel: {sub_0: 1.0, vol: 1.0} 1=auto, >1=zoom in, <1=zoom out
let _panelYDrag = null; // {panel, startY, startZoom}

const PANEL_MIN_PCT = 0.06;  // minimum 6% of H
const PANEL_MAX_PCT = 0.45;  // maximum 45% of H

let _panelDrag = null; // {panel, startY, startPct, H}

function getPanelH(key, H, defaultPct){
 const pct = panelSizes[key] !== undefined ? panelSizes[key] : defaultPct;
 return Math.round(H * Math.max(PANEL_MIN_PCT, Math.min(PANEL_MAX_PCT, pct)));
}

function _drawPanelHandle(ctx, x, y, CW){
 // Small grey square centered ON the separator line (half above, half below)
 const hw=14, hh=8, hx=x+4, hy=y-hh/2;
 ctx.fillStyle='rgba(90,105,125,0.85)';
 ctx.beginPath();
 ctx.roundRect(hx, hy, hw, hh, 2);
 ctx.fill();
 // 3 horizontal dots centered vertically
 ctx.fillStyle='rgba(190,200,220,0.8)';
 for(let i=0;i<3;i++){
  ctx.beginPath();
  ctx.arc(hx+3+i*4, y, 1.2, 0, Math.PI*2);
  ctx.fill();
 }
}

function _hitPanelHandle(px, py, hx, hy){
 // Hit area: wider for easy touch
 return px>=hx && px<=hx+40 && py>=hy-10 && py<=hy+10;
}

function _startPanelDrag(panel, startY, H){
 _panelDrag = {panel, startY, H,
  startPct: panelSizes[panel] !== undefined ? panelSizes[panel] :
   (panel==='vol' ? 0.14 : 0.09)
 };
}
function _movePanelDrag(currentY){
 if(!_panelDrag) return false;
 const {panel, startY, H, startPct} = _panelDrag;
 const dy = startY - currentY; // dragging up = increase, down = decrease
 const dpct = dy / H;
 const newPct = Math.max(PANEL_MIN_PCT, Math.min(PANEL_MAX_PCT, startPct + dpct));
 panelSizes[panel] = newPct;
 invalidateChart();
 render();
 return true;
}

function _endPanelDrag(){
 if(_panelDrag){
  _panelDrag = null;
  saveSettings();
  return true;
 }
 return false;
}

function _checkWaveDotTap(px, py){
 const dots = window._elliottDotsArr || [];
 if(!dots.length) return false;
 for(const dot of dots){
  const dist = Math.sqrt((px-dot.x)**2 + (py-dot.y)**2);

   return true;

// ── Order Flow (Delta Volume) ────────────────────────────
// Mock: estimates delta from candle body position
// Real API: replace _calcOrderFlow with actual tick data
let showOrderFlow = false;

function _calcOrderFlow(candles){
 // Delta estimation using CLV (Close Location Value) — industry standard for OHLCV
 // buyRatio = (close - low) / (high - low)
 // Ranges 0 (close at low = all selling) to 1 (close at high = all buying)
 // Bias < 1.5% on random data — academically accepted method
 return candles.map(d=>{
  const range = d.hi - d.lo || 0.001;
  const o = d.o || d.c;
  // CLV: primary signal from close position
  const clv = (d.c - d.lo) / range;
  // Blend with open position for direction bias
  const openLoc = (o - d.lo) / range;
  // Weighted: 60% close location, 40% open location (open shows intent)
  const buyRatio = Math.min(0.95, Math.max(0.05, clv * 0.6 + openLoc * 0.4));
  const buyVol = Math.round(d.v * buyRatio);
  const sellVol = d.v - buyVol;
  const delta = buyVol - sellVol;
  const deltaPct = delta / (d.v || 1) * 100;
  return { buyVol, sellVol, delta, deltaPct, cumDelta: 0 };
 }).map((d,i,arr)=>{
  d.cumDelta = i===0 ? d.delta : arr[i-1].cumDelta + d.delta;
  return d;
 });
}

async function _fetchOrderFlow(sym, per){
 // Try real API first
 const apiData = await API_CONFIG.fetch('orderflow', {sym, per});
 if(apiData) return apiData;
 // Fallback to calculated estimate
 return _calcOrderFlow(state.allCandles);
}

function _renderOrderFlow(ctx, sub, tx, top, ph, CW, bw){
 if(!showOrderFlow) return;
 const of = _calcOrderFlow(sub);
 if(!of.length) return;

 const maxAbs = Math.max(...of.map(d=>Math.abs(d.delta)), 1);
 const midY = top + ph*0.42; // zero line slightly above center (more room for negatives)
 const posH = midY - top - 4;   // space above zero line
 const negH = top + ph - midY - 4; // space below zero line
 const n = of.length;

 ctx.save();

 // Background
 ctx.fillStyle='rgba(4,7,16,0.75)';
 ctx.fillRect(0,top,CW,ph);

 // Grid lines at 25%, 50%, 75%
 [0.25,0.5,0.75,1.0].forEach(f=>{
  const py=midY-posH*f;
  const ny=midY+negH*f;
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(CW,py);ctx.stroke();
  if(f<1){ctx.beginPath();ctx.moveTo(0,ny);ctx.lineTo(CW,ny);ctx.stroke();}
 });

 // Zero line — stronger
 ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(0,midY);ctx.lineTo(CW,midY);ctx.stroke();

 // Find threshold for label display (top 30% bars)
 const sortedAbs=[...of.map(d=>Math.abs(d.delta))].sort((a,b)=>b-a);
 const labelThreshold=sortedAbs[Math.max(0,Math.floor(n*0.08))]||maxAbs*0.7; // top 8% only

 // Delta bars with + / - labels
 const barW=Math.max(1,bw-0.5);
 of.forEach((d,i)=>{
  const x=tx(i)-bw/2;
  const absD=Math.abs(d.delta);
  const isPos=d.delta>=0;

  // Bar height proportional, capped at available space
  const barH=isPos
   ? Math.min(posH, absD/maxAbs*posH)
   : Math.min(negH, absD/maxAbs*negH);

  // Color intensity based on strength
  const strength=absD/maxAbs;
  if(isPos){
   const alpha=0.35+strength*0.6;
   ctx.fillStyle=`rgba(34,197,94,${alpha})`;
   ctx.fillRect(x,midY-barH,barW,barH);
   // Top border line for strong bars
   if(strength>0.4){
    ctx.fillStyle=`rgba(34,197,94,${Math.min(1,alpha+0.3)})`;
    ctx.fillRect(x,midY-barH,barW,1.5);
   }
  } else {
   const alpha=0.35+strength*0.6;
   ctx.fillStyle=`rgba(239,68,68,${alpha})`;
   ctx.fillRect(x,midY,barW,barH);
   if(strength>0.4){
    ctx.fillStyle=`rgba(239,68,68,${Math.min(1,alpha+0.3)})`;
    ctx.fillRect(x,midY+barH-1.5,barW,1.5);
   }
  }

  // + / - label on significant bars
  if(absD>=labelThreshold&&barW>=6&&barH>=10){
   const lbl=isPos?'+':'-';
   ctx.fillStyle=isPos?'rgba(34,255,120,0.9)':'rgba(255,100,100,0.9)';
   ctx.font=`bold ${Math.min(9,barW*0.7)}px monospace`;
   ctx.textAlign='center';ctx.textBaseline='middle';
   const ly=isPos?midY-barH/2:midY+barH/2;
   ctx.fillText(lbl,tx(i),ly);
   ctx.textBaseline='alphabetic';
  }

  // No per-bar markers here — handled by smart signal system below
 });

 // ── Smart Delta Signals (clipped to panel) ─────────
 ctx.save();ctx.beginPath();ctx.rect(0,top,CW,ph);ctx.clip();
 // ── Smart Delta Signals ─────────────────────────────
 // Statistical analysis: find significant events only
 const deltas=of.map(d=>d.delta);
 const absDeltas=deltas.map(Math.abs);
 const mean=absDeltas.reduce((a,b)=>a+b,0)/absDeltas.length||1;
 const variance=absDeltas.reduce((a,b)=>a+(b-mean)**2,0)/absDeltas.length;
 const sigma=Math.sqrt(variance)||mean;
 const spikeThresh=mean+2*sigma;     // 2σ spike threshold
 const volMean=of.reduce((a,d)=>a+(d.buyVol+d.sellVol),0)/of.length||1;
 const absorbThresh=volMean*1.5;     // 1.5x avg volume
 const absorbDeltaPct=0.08;          // delta < 8% of volume = absorption
 
 // Min gap between same-type signals (avoid clustering)
 const lastSig={spike:-20,diverge:-20,exhaust:-20,absorb:-20};
 
 of.forEach((d,i)=>{
  if(i<3)return;
  const absD=Math.abs(d.delta);
  const isPos=d.delta>=0;
  const x=tx(i), vol=d.buyVol+d.sellVol;
  const barH=isPos?Math.min(posH,absD/maxAbs*posH):Math.min(negH,absD/maxAbs*negH);

  // ── 1. SPIKE ◆ — |delta| > 2σ (statistical outlier) ──────────
  if(absD>spikeThresh&&i-lastSig.spike>=8){
   lastSig.spike=i;
   const sy=Math.max(top+8,Math.min(top+ph-8,isPos?midY-barH-14:midY+barH+14));
   const sc=isPos?'#00ffaa':'#ff4466';
   // Diamond shape
   ctx.fillStyle=sc;
   ctx.beginPath();ctx.moveTo(x,sy-7);ctx.lineTo(x+5,sy);ctx.lineTo(x,sy+7);ctx.lineTo(x-5,sy);ctx.closePath();ctx.fill();
   ctx.fillStyle='rgba(0,0,0,0.7)';ctx.font='bold 5px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText('S',x,sy);ctx.textBaseline='alphabetic';
   // Subtle glow line down to bar
   ctx.strokeStyle=sc+'50';ctx.lineWidth=0.6;ctx.setLineDash([2,2]);
   ctx.beginPath();ctx.moveTo(x,sy+(isPos?7:-7));ctx.lineTo(x,isPos?midY-barH:midY+barH);ctx.stroke();ctx.setLineDash([]);
  }

  // ── 2. DIVERGENCE ▲▼ — cumulative delta diverges from price ───
  // Price higher high but cumDelta lower high = bearish divergence
  // Price lower low but cumDelta higher low = bullish divergence
  if(i>=5&&i-lastSig.diverge>=10){
   const lookback=Math.min(i,15);
   const priceSlice=sub.slice(i-lookback,i+1).map(c=>c.c);
   const cumSlice=of.slice(i-lookback,i+1).map(d=>d.cumDelta);
   const priceHigh=Math.max(...priceSlice),priceLow=Math.min(...priceSlice);
   const cumHigh=Math.max(...cumSlice),cumLow=Math.min(...cumSlice);
   const priceRange=priceHigh-priceLow||0.001;
   const cumRange=cumHigh-cumLow||1;
   // Normalize trend direction
   const priceDir=(sub[i].c-sub[i-lookback].c)/priceRange;
   const cumDir=(of[i].cumDelta-of[i-lookback].cumDelta)/cumRange;
   // Strong divergence: directions clearly opposite
   if(priceDir>0.3&&cumDir<-0.3){
    // Bearish divergence: price up, delta down
    lastSig.diverge=i;
    const dy=Math.max(top+8,midY-posH-18);
    ctx.fillStyle='#ff6666';ctx.strokeStyle='#ff6666';
    ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,80,80,0.15)';ctx.strokeStyle='#ff6666';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.roundRect(x-9,dy-7,18,14,3);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ff8888';ctx.fillText('DIV↓',x,dy);ctx.textBaseline='alphabetic';
   } else if(priceDir<-0.3&&cumDir>0.3){
    // Bullish divergence: price down, delta up
    lastSig.diverge=i;
    const dy=Math.min(top+ph-8,midY+negH+18);
    ctx.fillStyle='rgba(80,255,160,0.15)';ctx.strokeStyle='#00ff88';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.roundRect(x-9,dy-7,18,14,3);ctx.fill();ctx.stroke();
    ctx.fillStyle='#00ff88';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('DIV↑',x,dy);ctx.textBaseline='alphabetic';
   }
  }

  // ── 3. EXHAUSTION ⊗ — 4+ same-direction bars then reversal ───
  if(i>=4&&i-lastSig.exhaust>=8){
   const streak=4;
   let sameDir=true;
   const dir0=of[i-streak].delta>=0;
   for(let k=i-streak+1;k<i;k++){if((of[k].delta>=0)!==dir0)sameDir=false;}
   if(sameDir&&(d.delta>=0)!==dir0){
    lastSig.exhaust=i;
    const ey=Math.max(top+8,Math.min(top+ph-8,dir0?(midY+negH+12):(midY-posH-12)));
    const ec=d.delta>=0?'#22c55e':'#ef4444';
    ctx.strokeStyle=ec;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.arc(x,ey,6,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-4,ey-4);ctx.lineTo(x+4,ey+4);ctx.moveTo(x+4,ey-4);ctx.lineTo(x-4,ey+4);ctx.stroke();
    ctx.fillStyle=ec+'22';ctx.beginPath();ctx.arc(x,ey,6,0,Math.PI*2);ctx.fill();
   }
  }

  // ── 4. ABSORPTION ● — high volume, near-zero delta ─────────────
  if(vol>absorbThresh&&Math.abs(d.deltaPct)<absorbDeltaPct*100&&i-lastSig.absorb>=8){
   lastSig.absorb=i;
   const ay=midY; // right on zero line
   ctx.fillStyle='rgba(180,160,255,0.9)';
   ctx.beginPath();ctx.arc(x,ay,4,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#9080ff';ctx.lineWidth=1;
   ctx.beginPath();ctx.arc(x,ay,6,0,Math.PI*2);ctx.stroke();
   ctx.fillStyle='rgba(0,0,0,0.8)';ctx.font='bold 4px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText('A',x,ay);ctx.textBaseline='alphabetic';
  }
 });

 ctx.restore(); // end signals clip

 // Cumulative delta line
 const cumVals=of.map(d=>d.cumDelta);
 const cumMin=Math.min(...cumVals),cumMax=Math.max(...cumVals);
 const cumRng=cumMax-cumMin||1;
 ctx.strokeStyle='#fbbf24';ctx.lineWidth=1.4;
 ctx.shadowColor='rgba(251,191,36,0.3)';ctx.shadowBlur=3;
 ctx.beginPath();let ff=true;
 of.forEach((d,i)=>{
  const cy=top+4+(1-(d.cumDelta-cumMin)/cumRng)*(ph-8);
  ff?(ctx.moveTo(tx(i),cy),ff=false):ctx.lineTo(tx(i),cy);
 });
 ctx.stroke();
 ctx.shadowBlur=0;

 // DELTA label + last value
 ctx.fillStyle='#4a6080';ctx.font='bold 7px monospace';ctx.textAlign='left';
 ctx.fillText('DELTA',4,top+9);
 // ? button bottom-left corner
 const _qx=10,_qy=top+ph-10,_qr=7;
 ctx.fillStyle='rgba(59,158,255,0.18)';
 ctx.strokeStyle='rgba(59,158,255,0.5)';ctx.lineWidth=0.8;
 ctx.beginPath();ctx.arc(_qx,_qy,_qr,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle='#3b9eff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('?',_qx,_qy);ctx.textBaseline='alphabetic';
 // Store ? button hit area for tap detection
 ctx._ofHelpBtn={x:_qx,y:_qy,r:_qr+4};
 const last=of[of.length-1];
 const lv=last.delta;
 const lc=lv>=0?'#22c55e':'#ef4444';
 // Format number: K for thousands, M for millions
 const fmt=v=>{const a=Math.abs(v);return a>=1000000?(v/1000000).toFixed(2)+'M':a>=1000?(v/1000).toFixed(1)+'K':v.toLocaleString();}
 ctx.fillStyle=lc;ctx.font='bold 7.5px monospace';ctx.textAlign='right';
 ctx.fillText((lv>=0?'+':'')+fmt(lv),CW-4,top+9);

 // Cumulative delta value (bottom right)
 const cumLast=of[of.length-1].cumDelta;
 const cc=cumLast>=0?'rgba(251,191,36,0.8)':'rgba(251,191,36,0.8)';
 ctx.fillStyle=cc;ctx.font='6.5px monospace';ctx.textAlign='right';
 ctx.fillText('Σ'+(cumLast>=0?'+':'')+fmt(cumLast),CW-4,top+ph-4);

 ctx.restore();
}

async function _loadCalendar(){

function _renderCalendarOnChart(ctx, sub, tx, cTop, cH, CW){
 if(!showCalendar) return;
 // Show event markers on chart for current timeframe
 sub.forEach((d,i)=>{
  if(!d.t) return;
  const dDate = new Date(d.t).toISOString().slice(0,10);
  const events = calendarData.filter(e=>e.date===dDate);
  if(!events.length) return;
  const maxImpact = events.find(e=>e.impact==='high')||events.find(e=>e.impact==='medium')||events[0];
  const col = maxImpact.impact==='high'?'#ef4444':maxImpact.impact==='medium'?'#f59e0b':'#60a5fa';
  const x = tx(i);
  // Vertical marker line
  ctx.save();
  ctx.strokeStyle=col+'80';ctx.lineWidth=1;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(x,cTop+2);ctx.lineTo(x,cTop+cH-2);ctx.stroke();
  ctx.setLineDash([]);
  // Top flag
  ctx.fillStyle=col;
  ctx.beginPath();ctx.arc(x,cTop+6,4,0,Math.PI*2);ctx.fill();
  // Impact dot color
  ctx.fillStyle='#fff';ctx.font='bold 6px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(maxImpact.impact==='high'?'!':maxImpact.impact==='medium'?'·':'·',x,cTop+6);
  ctx.restore();
 });
}

// ── Stock Comparison (Overlay) ──────────────────────────
let compareStk = null; // {sym, name, candles[]}
let showCompare = false;

function _renderCompareOverlay(ctx, sub, tx, ty, cTop, cH, CW, mn, rng){
 if(!showCompare || !compareStk || !compareStk.candles.length) return;
 // Align comparison candles to same window
 const all2 = compareStk.candles;
 const VIS = sub.length;
 const off2 = Math.max(0, all2.length - VIS);
 const sub2 = all2.slice(off2, off2 + VIS);
 if(!sub2.length) return;

 // Normalize comparison to same price scale as main (% change from first visible)
 const base1 = sub[0]?.c || 1;
 const base2 = sub2[0]?.c || 1;

 ctx.save();
 ctx.beginPath();ctx.rect(0,cTop,CW,cH);ctx.clip();

 ctx.strokeStyle = '#f59e0b';
 ctx.lineWidth = 1.2;
 ctx.setLineDash([3,2]);
 ctx.globalAlpha = 0.7;
 ctx.beginPath();
 let first = true;
 sub2.forEach((d,i)=>{
  if(!d||!sub[i]) return;
  // Normalize: map % change of stk2 onto stk1 price scale
  const pctChange = (d.c - base2) / base2;
  const normalizedPrice = base1 * (1 + pctChange);
  const y = ty(normalizedPrice);
  first ? (ctx.moveTo(tx(i), y), first=false) : ctx.lineTo(tx(i), y);
 });
 ctx.stroke();
 ctx.setLineDash([]);
 ctx.globalAlpha = 1;

 // Label at right edge
 const lastD = sub2[sub2.length-1];
 const lastMain = sub[sub.length-1];
 if(lastD && lastMain){
  const pct = ((lastD.c - base2)/base2*100).toFixed(1);
  const pctMain = ((lastMain.c - base1)/base1*100).toFixed(1);
  const labelY = ty(base1*(1+(lastD.c-base2)/base2));
  ctx.fillStyle = 'rgba(245,158,11,0.85)';
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(compareStk.sym+' '+pct+'%', CW-4, Math.max(cTop+8, Math.min(cTop+cH-8, labelY)));
  ctx.textBaseline = 'alphabetic';
 }
 ctx.restore();
}

// ── لوحة "لا توجد بيانات" — تُرسم عند فشل الـ API ──────────────
function _drawNoData(W,H){
  const ctx=cv.getContext('2d');
  ctx.save();
  ctx.clearRect(0,0,W,H);
  // خلفية متدرجة خفيفة
  ctx.fillStyle='#060c18';
  ctx.fillRect(0,0,W,H);
  const cx=W/2, cy=H/2;
  // أيقونة دائرية
  ctx.strokeStyle='rgba(239,68,68,0.5)';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy-34,22,0,Math.PI*2);ctx.stroke();
  // علامة تعجب
  ctx.strokeStyle='#ef4444';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,cy-44);ctx.lineTo(cx,cy-30);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy-23,1.6,0,Math.PI*2);ctx.fillStyle='#ef4444';ctx.fill();
  // الرسالة
  const msg=state.dataError||'تعذّر تحميل بيانات السهم';
  ctx.fillStyle='#c0d0e8';
  ctx.font='bold 14px Cairo,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(msg,cx,cy+6);
  // سطر فرعي
  ctx.fillStyle='#4a6080';
  ctx.font='11px Cairo,sans-serif';
  ctx.fillText('اضغط لإعادة المحاولة',cx,cy+30);
  ctx.restore();
  // منطقة قابلة للنقر لإعادة التحميل
  cv.style.cursor='pointer';
  cv._noDataRetry=true;
}

function render(){
 try {
 const W=cv.offsetWidth||window.innerWidth;
 const H=cv.offsetHeight||400;
 if(!W||!H||H<50)return;
 _offValid=false; // will be set true after chart is drawn
 _checkIndAlerts();
 requestAnimationFrame(_updateZoomCtrlPos);
 
 const all=state.allCandles;
 if(!all.length){
  // لا بيانات — ارسم لوحة الخطأ بدل ترك الشاشة فارغة
  _drawNoData(W,H);
  return;
 }

 const YW=38, CW=W-YW;
 const OF_H=showOrderFlow?getPanelH('of',H,0.10):0; // order flow panel
 const VOL_H=getPanelH('vol',H,0.14); // volume panel — resizable
 const SUB_INDS_BASE=['RSI','MACD','STOCH','STOCHRSI','OBV','MFI','ADX','ATR','STD'].filter(id=>state.activeInds.includes(id));
  // Auto-add MACD panel when TRIPLE_SCR strategy is active
  const _subBase=(activeStrategy==='TRIPLE_SCR'&&!SUB_INDS_BASE.includes('MACD'))
    ?['MACD',...SUB_INDS_BASE]
    :SUB_INDS_BASE;
  // Add custom subpanel indicators
  const SUB_INDS=[..._subBase,...customInds.filter(ci=>ci.type==='subpanel').map(ci=>ci.id)];
 const hasSubPanel=SUB_INDS.length>0;
 // Each sub-panel has its own resizable height
 const _subPanH=SUB_INDS.map((_,pi)=>getPanelH('sub_'+pi,H,0.09));
 const SUB_H=hasSubPanel?_subPanH.reduce((a,b)=>a+b,0):0;
 const PB=22,PT=12,SEP=3;
 const cTop=PT,cBot=H-PB-SEP-VOL_H-(hasSubPanel?SUB_H+SEP:0)-(OF_H?OF_H+SEP:0),cH=cBot-cTop;
 const vTop=cBot+SEP,vBot=vTop+VOL_H;
 const subTop=hasSubPanel?vBot+SEP:0;
 // panH now per-panel from _subPanH
 const panH=hasSubPanel&&SUB_INDS.length?Math.floor(SUB_H/SUB_INDS.length):0;

 const VIS=Math.min(Math.max(8,state.visible),all.length);
 const maxOff=Math.max(0,all.length-VIS);
 const clampOff=Math.min(maxOff,Math.max(0,state.offset));
 const end=all.length-clampOff,start=Math.max(0,end-VIS);
 const sub=all.slice(start,end),n=sub.length;
 // Renko: compute from FULL dataset then slice — prevents bricks disappearing on pan
 let renkoSub=null;
 if(state.chartType==='renko'&&all.length>2){
  // Brick size based on full dataset ATR (stable across panning)
  const _allHi=Math.max(...all.map(d=>d.hi)), _allLo=Math.min(...all.map(d=>d.lo));
  const brickSz=Math.max((_allHi-_allLo)/all.length*1.5, all[0].c*0.005);
  const renkoAll=[];let rp=all[0].c;
  all.forEach(d=>{
   while(d.c>=rp+brickSz){rp+=brickSz;renkoAll.push({o:rp-brickSz,c:rp,hi:rp,lo:rp-brickSz,v:d.v,t:d.t,_ren:1});}
   while(d.c<=rp-brickSz){rp-=brickSz;renkoAll.push({o:rp+brickSz,c:rp,hi:rp+brickSz,lo:rp,v:d.v,t:d.t,_ren:-1});}
  });
  // Now slice the same visible window from the full renko array
  if(renkoAll.length>0){
   const renkoVIS=Math.min(Math.max(8,state.visible),renkoAll.length);
   const renkoMaxOff=Math.max(0,renkoAll.length-renkoVIS);

 if(hasInd('VP')&&sub.length>0){
  const VP_W=Math.round(CW*0.08);

  const BINS=40;
  const priceRange=mx-mn||0.01;
  const binSize=priceRange/BINS;
  const binsUp=new Float64Array(BINS);
  const binsDn=new Float64Array(BINS);
  // Distribute each candle's volume across its Hi-Lo range (TPO method)
  sub.forEach(d=>{
   const loB=Math.max(0,Math.min(BINS-1,Math.floor((d.lo-mn)/binSize)));
   const hiB=Math.max(0,Math.min(BINS-1,Math.floor((d.hi-mn)/binSize)));
   const span=Math.max(1,hiB-loB+1);
   const volPerBin=d.v/span;
   const isUp=d.c>=d.o;
   for(let b=loB;b<=hiB&&b<BINS;b++){
    if(isUp)binsUp[b]+=volPerBin;
    else binsDn[b]+=volPerBin;
   }
  });
  const binsTotal=binsUp.map((v,i)=>v+binsDn[i]);
  const maxBin=Math.max(...binsTotal)||1;
  const totalVol=binsTotal.reduce((s,v)=>s+v,0);
  // Value Area (70% of volume around POC)
  const pocIdx=binsTotal.indexOf(Math.max(...binsTotal));
  let vaVol=binsTotal[pocIdx],vaLo=pocIdx,vaHi=pocIdx;
  const VA_PCT=0.70;
  while(vaVol<totalVol*VA_PCT&&(vaLo>0||vaHi<BINS-1)){
   const downVol=vaLo>0?binsTotal[vaLo-1]:0;
   const upVol=vaHi<BINS-1?binsTotal[vaHi+1]:0;
   if(upVol>=downVol&&vaHi<BINS-1){vaHi++;vaVol+=binsTotal[vaHi];}
   else if(vaLo>0){vaLo--;vaVol+=binsTotal[vaLo];}
   else break;
  }
  // Background
  ctx.fillStyle=darkTheme?'rgba(4,7,14,0.55)':'rgba(240,244,250,0.7)';
  ctx.fillRect(VP_X,cTop,VP_W+1,cH);

  for(let i=0;i<BINS;i++){
   const vol=binsTotal[i];if(!vol)continue;
   const barW=Math.max(1,Math.round((vol/maxBin)*(VP_W-2)));
   const barY=Math.round(cTop+cH-((i+1)/BINS)*cH);
   const barH=Math.max(1,Math.round(cH/BINS)-0.5);
   const isPOC=i===pocIdx;
   const inVA=i>=vaLo&&i<=vaHi;
   const upFrac=binsUp[i]/(vol||1);
   const dnFrac=1-upFrac;
   // Split bar into buy (green) and sell (red)
   const upW=Math.round(barW*upFrac),dnW=barW-upW;
   ctx.fillStyle=isPOC?'#f59e0b':inVA?'rgba(59,158,255,0.55)':'rgba(59,158,255,0.25)';

  }

  ctx.beginPath();ctx.moveTo(0,pocY);ctx.lineTo(VP_X,pocY);ctx.stroke();

  });

  const wyEvents=[]; // {type, gi, price}
  let wyS='none',scLow=null,arHigh=null,stLow=null,scGi=0;
  let _wyLastGi=-20; // min gap between events

  const _wyPush=(ev)=>{ // Only push if gap >= 5 bars (main events) or 10 (BU/LPS)
   const minGap=ev.type==='BU'||ev.type==='LPS'?15:5;
   if(ev.gi-_wyLastGi>=minGap){wyEvents.push(ev);_wyLastGi=ev.gi;}
  };
  for(let gi=5;gi<_N;gi++){
   const d=all[gi];
   const _atrVal=_atrSma[gi]||0.01,vma=_volSma[gi]||1;
   const bigVol=d.v>vma*1.4;       // 1.4× avg volume
   const bigDown=d.c<d.o&&(d.o-d.c)>_atrVal*0.5; // relaxed threshold
   const bigUp=d.c>d.o&&(d.c-d.o)>_atrVal*0.5;
   const weakVol=d.v<vma*1.0; // any below-average volume

   if(wyS==='none'){
    // SC: Selling Climax
    // - Wide-spread DOWN bar near recent lows, elevated volume
    // - Key: closes ABOVE the bar's midpoint (reversal wick = absorption)
    const lo30=allL.slice(Math.max(0,gi-30),gi);
    const isNearLow=lo30.length&&d.lo<=Math.min(...lo30)*1.03;
    const hasWick=d.c>(d.lo+(d.hi-d.lo)*0.35); // closes in upper 35%+ of range
    if(bigDown&&bigVol&&isNearLow&&hasWick){
     wyS='SC';scLow=d.lo;scGi=gi;
     _wyPush({type:'SC',gi,price:d.lo,label:'SC',clr:'#ef4444'});
    }
   } else if(wyS==='SC'){
    // AR: Automatic Rally — strong bounce within 15 bars of SC
    if(bigUp&&d.c>d.o&&gi<scGi+15){
     wyS='AR';arHigh=d.hi;
     _wyPush({type:'AR',gi,price:d.hi,label:'AR',clr:'#22c55e'});
    }
   } else if(wyS==='AR'){
    // ST: Secondary Test — revisits SC area, LESS volume than SC
    if(scLow&&d.lo<=scLow*1.03&&weakVol){
     wyS='ST';stLow=d.lo;
     _wyPush({type:'ST',gi,price:d.lo,label:'ST',clr:'#f59e0b'});
    }
    // Direct Spring (skipped ST)
    else if(scLow&&d.lo<scLow*0.995&&d.c>scLow&&weakVol){
     // MUST close back above SC low to confirm Spring (not a breakdown)
     wyS='SP';
     _wyPush({type:'SP',gi,price:d.lo,label:'Spring',clr:'#a78bfa',signal:true});
    }
   } else if(wyS==='ST'){
    // Spring: penetrates below SC low then CLOSES BACK ABOVE it (false breakdown)
    // This is the most critical rule — if it doesn't close above SC low = breakdown, not Spring
    if(scLow&&d.lo<scLow*0.995&&d.c>scLow&&weakVol){
     wyS='SP';
     _wyPush({type:'SP',gi,price:d.lo,label:'Spring',clr:'#a78bfa',signal:true});
    }
    // LPS: higher low than SC/ST with weak volume, followed by rally
    else if(scLow&&stLow&&d.lo>stLow*0.99&&d.lo<arHigh&&weakVol&&bigUp){
     _wyPush({type:'LPS',gi,price:d.lo,label:'LPS',clr:'#22d3ee'});
    }
   } else if(wyS==='SP'){
    // SOS: Sign of Strength — breaks above AR high on BIG volume
    if(arHigh&&d.c>arHigh&&bigVol&&d.c>d.o){
     wyS='SOS';
     _wyPush({type:'SOS',gi,price:d.hi,label:'SOS ↑',clr:'#22c55e',signal:true});
    }
    // LPS in accumulation phase (before SOS)
    else if(scLow&&d.lo>scLow&&d.lo<arHigh&&weakVol&&bigUp){
     _wyPush({type:'LPS',gi,price:d.lo,label:'LPS',clr:'#22d3ee'});
    }
   } else if(wyS==='SOS'){
    // BU (BUEC): Back Up to Edge of Creek — pullback to AR level on WEAK volume
    if(arHigh&&d.c<=arHigh*1.015&&d.c>=arHigh*0.97&&weakVol&&!wyEvents.find(e=>e.type==='BU'&&gi-e.gi<30)){
     _wyPush({type:'BU',gi,price:d.c,label:'BU',clr:'#34d399'});
    }
   }
   // Allow new cycle if price makes new high (distribution phase)
   if(wyS==='SOS'&&arHigh&&d.c>arHigh*1.08&&bigVol){
    wyS='none';scLow=null;arHigh=null;stLow=null;
   }
  }

  ctx.save();ctx.beginPath();ctx.rect(0,cTop,CW,cH+1);ctx.clip();
  // ── RENDER: SC/AR horizontal zones ──────────
  if(scLow!=null){
   ctx.fillStyle='rgba(239,68,68,0.07)';
   ctx.fillRect(0,ty(scLow*(arHigh?1:1.02)),CW,ty(scLow*0.97)-ty(scLow*(arHigh?1:1.02)));
   ctx.strokeStyle='rgba(239,68,68,0.5)';ctx.lineWidth=1;ctx.setLineDash([5,3]);
   ctx.beginPath();ctx.moveTo(0,ty(scLow));ctx.lineTo(CW,ty(scLow));ctx.stroke();
   ctx.fillStyle='#ef4444';ctx.font='bold 7px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
   ctx.fillText('SC '+scLow.toFixed(2),4,ty(scLow)-6);ctx.textBaseline='alphabetic';
  }
  if(arHigh!=null){
   ctx.strokeStyle='rgba(34,197,94,0.5)';ctx.lineWidth=1;ctx.setLineDash([5,3]);
   ctx.beginPath();ctx.moveTo(0,ty(arHigh));ctx.lineTo(CW,ty(arHigh));ctx.stroke();
   ctx.fillStyle='#22c55e';ctx.font='bold 7px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
   ctx.fillText('AR '+arHigh.toFixed(2),4,ty(arHigh)+8);ctx.textBaseline='alphabetic';
  }
  ctx.setLineDash([]);

  // ── RENDER: Phase markers ─────────────────────
  // Wyckoff positioning guide:
  // ABOVE candle (at high): AR, SOS, BU — bullish confirmations at peaks
  // BELOW candle (at low):  SC, ST, Spring, LPS — support/reversal at lows
  wyEvents.forEach(ev=>{
   const vi=ev.gi-start;
   if(vi<0||vi>=sub.length)return;
   const d=sub[vi];
   const x=tx(vi);

   // Determine if label goes above or below the candle
   const aboveCandle=ev.type==='AR'||ev.type==='SOS'||ev.type==='BU';
   // SC, ST, Spring, LPS all go BELOW (they mark support/low points)

   ctx.fillStyle=ev.clr+'e0';
   ctx.strokeStyle=ev.clr;ctx.lineWidth=1;

   if(aboveCandle){
    // Label above the candle high
    const sy=Math.max(cTop+20, ty(d.hi)-4);
    ctx.beginPath();ctx.roundRect(x-22,sy-20,44,16,4);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 8px Cairo,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ev.label,x,sy-12);ctx.textBaseline='alphabetic';
    // SOS: big bullish arrow below candle
    if(ev.signal){
     const ay=Math.min(cBot-22,ty(d.lo)+28);
     ctx.fillStyle=ev.clr;
     ctx.beginPath();ctx.arc(x,ay,11,0,Math.PI*2);ctx.fill();
     ctx.strokeStyle=ev.clr+'66';ctx.lineWidth=5;
     ctx.beginPath();ctx.arc(x,ay,17,0,Math.PI*2);ctx.stroke();
     ctx.fillStyle='#fff';ctx.lineWidth=1;ctx.font='bold 10px monospace';
     ctx.textAlign='center';ctx.textBaseline='middle';
     ctx.fillText('▲',x,ay);ctx.textBaseline='alphabetic';
    }
   } else {
    // Label below the candle low
    const sy=Math.min(cBot-20, ty(d.lo)+4);
    ctx.beginPath();ctx.roundRect(x-22,sy+4,44,16,4);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 8px Cairo,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ev.label,x,sy+12);ctx.textBaseline='alphabetic';
    // Spring: big bullish arrow (W) below label — Spring is a BULLISH reversal signal
    if(ev.signal){
     const ay=Math.min(cBot-22,ty(d.lo)+50);
     ctx.fillStyle=ev.clr;
     ctx.beginPath();ctx.arc(x,ay,11,0,Math.PI*2);ctx.fill();
     ctx.strokeStyle=ev.clr+'66';ctx.lineWidth=5;
     ctx.beginPath();ctx.arc(x,ay,17,0,Math.PI*2);ctx.stroke();
     ctx.fillStyle='#fff';ctx.lineWidth=1;ctx.font='bold 10px monospace';
     ctx.textAlign='center';ctx.textBaseline='middle';
     ctx.fillText('W',x,ay);ctx.textBaseline='alphabetic';
    }
   }
  });
  ctx.restore();
 }

 // ── SUPPLY & DEMAND ZONES ─────────────────────
 // Detects explosive moves originating from a consolidation zone
 if(activeStrategy==='SUPPLY_DEMAND'){
  // ══ SUPPLY & DEMAND — Sam Seiden Method (Ground Up) ══
  const _N=allC.length;
  const curPrice=allC[_N-1];

  // ATR
  const _tr=allC.map((_,j)=>j===0?allH[j]-allL[j]:
    Math.max(allH[j]-allL[j],Math.abs(allH[j]-allC[j-1]),Math.abs(allL[j]-allC[j-1])));
  const _atr=sma(_tr,14);
  const atrNow=_atr[_N-1]||1;

  // Visible price window
  const visHi=Math.max(...sub.map(d=>d.hi));
  const visLo=Math.min(...sub.map(d=>d.lo));

  // ── STEP 1: Detect impulse moves ──────────────
  // An impulse = candle with body > 0.4×ATR
  // Its ORIGIN ZONE = the candle(s) immediately before it that were "basing"
  const rawZones=[];
  for(let gi=2;gi<_N-1;gi++){
    const d=all[gi];
    const atr=_atr[gi]||0.001;
    const body=Math.abs(d.c-d.o);
    if(body<atr*0.4)continue; // not an impulse

    const isBull=d.c>d.o;

    // Origin = 1 candle before impulse (the base)
    // Use only 1 candle to keep zone tight and clean
    const base=all[gi-1];
    const zHi=base.hi;
    const zLo=base.lo;
    const zW=zHi-zLo;

    // Zone must be a valid small range (0.05–1.0×ATR)
    if(zW<atr*0.05||zW>atr*1.0||zHi<=zLo)continue;

    // Zone type: bullish impulse = demand BELOW, bearish = supply ABOVE
    const type=isBull?'D':'S';

    // Tested: did price come back to this zone after it formed?
    let tested=false;
    for(let j=gi+1;j<_N;j++){
      if(all[j].c>zLo&&all[j].c<zHi){tested=true;break;}
    }

    rawZones.push({hi:zHi,lo:zLo,mid:(zHi+zLo)/2,type,gi,tested,
      strength:Math.min(9.9,+(body/atr).toFixed(1))});
  }

  // ── STEP 2: Deduplicate by price level ────────
  // Keep only the MOST RECENT zone at each price cluster (0.4×ATR gap)
  const dedupZones=[];
  // Process most recent first
  for(let i=rawZones.length-1;i>=0;i--){
    const z=rawZones[i];
    const exists=dedupZones.some(o=>o.type===z.type&&
      Math.abs(o.mid-z.mid)<atrNow*0.4);
    if(!exists)dedupZones.push(z);
  }

  // ── STEP 3: Filter to visible price range ──────
  const visZones=dedupZones.filter(z=>
    z.hi>visLo&&z.lo<visHi // overlaps visible range
  );

  // ── STEP 4: Pick top 3 demand + 3 supply ───────
  const topD=visZones.filter(z=>z.type==='D')
    .sort((a,b)=>(!a.tested&&b.tested?-1:a.tested&&!b.tested?1:0)||
      Math.abs(a.mid-curPrice)-Math.abs(b.mid-curPrice))
    .slice(0,3);
  const topS=visZones.filter(z=>z.type==='S')
    .sort((a,b)=>(!a.tested&&b.tested?-1:a.tested&&!b.tested?1:0)||
      Math.abs(a.mid-curPrice)-Math.abs(b.mid-curPrice))
    .slice(0,3);
  const toDraw=[...topD,...topS];

  // ── STEP 5: Draw zones ─────────────────────────
  toDraw.forEach(z=>{
    const isDZ=z.type==='D';
    const fresh=!z.tested;
    const rgb=isDZ?'34,197,94':'239,68,68';
    const hex=isDZ?'#22c55e':'#ef4444';

    // Clamp Y to chart bounds
    const y1=Math.max(cTop+1, Math.min(cBot-1, ty(z.hi)));
    const y2=Math.max(cTop+1, Math.min(cBot-1, ty(z.lo)));
    const zh=Math.max(2, y2-y1);

    // Fill
    ctx.fillStyle=`rgba(${rgb},${fresh?0.13:0.07})`;
    ctx.fillRect(0,y1,CW-38,zh);

    // Top line (main boundary)
    ctx.strokeStyle=`rgba(${rgb},${fresh?0.9:0.5})`;
    ctx.lineWidth=fresh?1.8:1.0;
    ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(0,y1);ctx.lineTo(CW-38,y1);ctx.stroke();

    // Bottom line (subtle)
    ctx.strokeStyle=`rgba(${rgb},0.2)`;
    ctx.lineWidth=0.5;
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(0,y2);ctx.lineTo(CW-38,y2);ctx.stroke();
    ctx.setLineDash([]);

    // Label
    const ly=Math.max(cTop+9,Math.min(cBot-9,(y1+y2)/2));
    const lbl=(isDZ?'طلب ':'عرض ')+z.lo.toFixed(2)+'–'+z.hi.toFixed(2)+(fresh?' 🔥':'');
    const lw=Math.min(CW-46, lbl.length*5.1+8);
    ctx.fillStyle=`rgba(${rgb},${fresh?0.9:0.55})`;
    ctx.beginPath();ctx.roundRect(4,ly-7,lw,14,3);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 7px monospace';
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(lbl,7,ly);ctx.textBaseline='alphabetic';
  });

  // ── STEP 6: Signals ────────────────────────────
  if(sub.length>=2){
    const cur=sub[sub.length-1];
    const prev=sub[sub.length-2];
    const ax=tx(sub.length-1);

    // CHECK SELL: price inside supply zone
    const hitSupply=topS.find(z=>cur.c>=z.lo&&cur.c<=z.hi);
    // CHECK BUY: price inside demand zone
    const hitDemand=topD.find(z=>cur.c>=z.lo&&cur.c<=z.hi);

    // Priority: supply (sell) over demand (buy) if both
    const hitZone=hitSupply||hitDemand||null;

    if(hitZone){
      const isDZ=hitZone.type==='D';
      const hex=isDZ?'#22c55e':'#ef4444';

      // Signal badge — inside zone, right side
      const y1=Math.max(cTop,ty(hitZone.hi));
      const y2=Math.min(cBot,ty(hitZone.lo));
      const sigY=Math.max(cTop+14,Math.min(cBot-14,(y1+y2)/2));

      ctx.fillStyle=hex+'ee';
      ctx.beginPath();ctx.roundRect(CW-130,sigY-14,90,28,8);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 10px Cairo,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(isDZ?'▲ شراء':'▼ بيع',CW-85,sigY);
      ctx.textBaseline='alphabetic';

      // Entry arrow when price just crossed into zone
      const justBuy=isDZ&&prev.c<hitZone.lo&&cur.c>=hitZone.lo;
      const justSell=!isDZ&&prev.c>hitZone.hi&&cur.c<=hitZone.hi;

      if(justBuy||justSell){
        const ay=isDZ
          ?Math.max(cTop+24,ty(cur.lo)-30)
          :Math.min(cBot-24,ty(cur.hi)+30);
        // Arrow
        ctx.fillStyle=hex;
        if(isDZ){
          ctx.beginPath();ctx.moveTo(ax,ay+20);ctx.lineTo(ax-13,ay+4);ctx.lineTo(ax+13,ay+4);ctx.fill();
        }else{
          ctx.beginPath();ctx.moveTo(ax,ay-20);ctx.lineTo(ax-13,ay-4);ctx.lineTo(ax+13,ay-4);ctx.fill();
        }
        // Circle
        ctx.beginPath();ctx.arc(ax,ay,11,0,Math.PI*2);ctx.fill();
        // Glow
        ctx.strokeStyle=hex+'55';ctx.lineWidth=5;
        ctx.beginPath();ctx.arc(ax,ay,17,0,Math.PI*2);ctx.stroke();
        ctx.lineWidth=1.5;
        // Icon
        ctx.fillStyle='#fff';ctx.font='bold 11px monospace';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(isDZ?'▲':'▼',ax,ay);ctx.textBaseline='alphabetic';
      }
    }

    // ── Show historical buy/sell signals on chart ──
    // Scan all visible bars for zone entries
    sub.forEach((d,si)=>{
      if(si===0)return;
      const p=sub[si-1];
      const bx=tx(si);

      // Buy: bar entered a demand zone
      topD.forEach(z=>{
        if(p.c<z.lo&&d.c>=z.lo&&d.c<=z.hi){
          ctx.fillStyle='#22c55e';
          ctx.beginPath();ctx.moveTo(bx,ty(d.lo)-18);ctx.lineTo(bx-9,ty(d.lo)-4);ctx.lineTo(bx+9,ty(d.lo)-4);ctx.fill();
          ctx.beginPath();ctx.arc(bx,ty(d.lo)-22,7,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('B',bx,ty(d.lo)-22);ctx.textBaseline='alphabetic';
        }
      });

      // Sell: bar entered a supply zone
      topS.forEach(z=>{
        if(p.c>z.hi&&d.c<=z.hi&&d.c>=z.lo){
          ctx.fillStyle='#ef4444';
          ctx.beginPath();ctx.moveTo(bx,ty(d.hi)+18);ctx.lineTo(bx-9,ty(d.hi)+4);ctx.lineTo(bx+9,ty(d.hi)+4);ctx.fill();
          ctx.beginPath();ctx.arc(bx,ty(d.hi)+22,7,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('S',bx,ty(d.hi)+22);ctx.textBaseline='alphabetic';
        }
      });
    });
  }

  // ── Legend ──────────────────────────────────
  ctx.fillStyle='rgba(8,14,28,0.88)';
  ctx.beginPath();ctx.roundRect(4,cTop+4,152,36,8);ctx.fill();
  ctx.fillStyle='#22c55e';ctx.font='bold 7px Cairo,sans-serif';
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('● طلب = شراء  ★=جديدة  B=دخول',8,cTop+14);
  ctx.fillStyle='#ef4444';
  ctx.fillText('● عرض = بيع  S=دخول',8,cTop+29);
  ctx.textBaseline='alphabetic';
 }

 // ── MOMENTUM PRO ─────────────────────────────

   let bs=0;
   if(r>55&&r<75)bs++;
   if(m>0&&m>(mp||0))bs++;

   if(bs>=3&&prevBuyScore<3)inBuy=true;
   let ss=0;
   if(r<45||r>78)ss++;
   if(m<0&&m<(mp||0))ss++;

   if(ss>=2&&prevSellScore<2)inBuy=false;
   prevBuyScore=bs;prevSellScore=ss;
  }

   const c4=e9>e21&&d.c>e9;
   const buyScore=(c1?1:0)+(c2?1:0)+(c3?1:0)+(c4?1:0);

   // ── SELL score (0–3) ──────────────────────────
   // S1: RSI overbought (>72) or oversold bounce failed (<45)
   const s1=r>72||r<45;
   // S2: MACD histogram negative AND falling (momentum reversing)
   const s2=m<0&&m<mp;
   // S3: EMA9 < EMA21 AND price below EMA9 (bearish alignment)
   const s3=e9<e21&&d.c<e9;
   const sellScore=(s1?1:0)+(s2?1:0)+(s3?1:0);

   // ── BUY signal: score >=3 AND was <3 (fresh entry) ──
   if(buyScore>=3&&prevBuyScore<3&&!inBuy){

    ctx.fillStyle='#22d3ee';

 // ══ SUPERTREND Strategy ══════════════════════════════════════
 try{if(activeStrategy==='SUPERTREND'&&all.length>14){
  const allN=all.length;
  const _atrST=atr(all,10).map(v=>v||0);
  const MULT=3;
  const stLine=[],stTrend=[];
  // Standard Supertrend (Pine Script equivalent):
  // upperBand = hl2 + mult*ATR  → resistance when bearish
  // lowerBand = hl2 - mult*ATR  → support when bullish
  // when bullish: lowerBand = max(lowerBand, prevLowerBand) — only rises
  // when bearish: upperBand = min(upperBand, prevUpperBand) — only falls
  let prevUpper=null,prevLower=null,prevTrend=1;
  for(let i=0;i<allN;i++){
   const mid=(all[i].hi+all[i].lo)/2;
   const a=_atrST[i]||0;
   let upper=mid+MULT*a, lower=mid-MULT*a;
   // Clamp bands so they don't whipsaw
   if(prevUpper!==null) upper=Math.min(upper,prevUpper);
   if(prevLower!==null) lower=Math.max(lower,prevLower);
   // Determine trend
   let t=prevTrend;
   if(prevTrend===1&&all[i].c<lower) t=-1;       // price broke below support → bearish
   else if(prevTrend===-1&&all[i].c>upper) t=1;  // price broke above resistance → bullish
   // Reset bands on trend flip
   if(t!==prevTrend){
    const mid2=(all[i].hi+all[i].lo)/2;
    upper=mid2+MULT*a;
    lower=mid2-MULT*a;
   }
   stLine.push(t===1?lower:upper); // line follows support in uptrend, resistance in downtrend
   stTrend.push(t);
   prevUpper=upper; prevLower=lower; prevTrend=t;
  }
  ctx.save();
  ctx.beginPath();ctx.rect(0,cTop,CW,cH+1);ctx.clip();
  ctx.lineWidth=2.2;
  ctx.strokeStyle='#22c55e';
  let _prevT=null,_segStarted=false;
  sub.forEach((d,i)=>{
   const gi=start+i;
   const t=stTrend[gi];
   const line=stLine[gi];
   if(line==null||isNaN(line))return;
   const px=tx(i),py=ty(line);
   if(!_segStarted||t!==_prevT){
    if(_segStarted){ctx.stroke();}
    ctx.beginPath();ctx.moveTo(px,py);
    ctx.strokeStyle=t===1?'#22c55e':'#ef4444';
    _segStarted=true;
   } else {
    ctx.lineTo(px,py);
   }
   _prevT=t;
  });
  if(_segStarted)ctx.stroke();
  // Signals on trend flip
  sub.forEach((d,i)=>{
   const gi=start+i;if(gi<1)return;
   const t=stTrend[gi],pt=stTrend[gi-1];
   if(!pt||t===pt)return;
   if(t===1){
    // Bullish flip → GREEN UP arrow below candle
    const ay=Math.min(cBot-20,ty(d.lo)+24);
    ctx.fillStyle='#22c55e';
    ctx.beginPath();ctx.moveTo(tx(i),ay-14);ctx.lineTo(tx(i)-10,ay);ctx.lineTo(tx(i)+10,ay);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('▲',tx(i),ay-4);ctx.textBaseline='alphabetic';
   } else {
    // Bearish flip → RED DOWN arrow above candle
    const ay=Math.max(cTop+20,ty(d.hi)-24);
    ctx.fillStyle='#ef4444';
    ctx.beginPath();ctx.moveTo(tx(i),ay+14);ctx.lineTo(tx(i)-10,ay);ctx.lineTo(tx(i)+10,ay);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('▼',tx(i),ay+4);ctx.textBaseline='alphabetic';
   }
  });
  ctx.restore();
 }}catch(_e_SUPERTREND){console.error('SUPERTREND error:',_e_SUPERTREND.message,_e_SUPERTREND.stack);}

function renderCrosshair(){
 if(!_offValid||!_offCv||!_offCtx)return render(); // fallback to full render
 const W=cv.offsetWidth||window.innerWidth;
 const H=cv.offsetHeight||400;
 if(!W||!H)return;
 // Restore chart from offscreen
 ctx.clearRect(0,0,cv.width,cv.height);
 ctx.drawImage(_offCv,0,0);
 // Now re-draw only the crosshair section
 // We need dimensions to compute chart bounds
 const YW=38, CW=W-YW;
 const VOL_H=Math.round(H*0.14);
 const SUB_INDS=['RSI','MACD','STOCH','STOCHRSI','OBV','MFI','ADX','ATR','STD'].filter(id=>state.activeInds.includes(id));
 const hasSubPanel=SUB_INDS.length>0;
 const SUB_H=hasSubPanel?Math.round(H*Math.min(0.28,SUB_INDS.length*0.09)):0;
 const PB=22,PT=12,SEP=3;
 const cTop=PT,cBot=H-PB-SEP-VOL_H-(hasSubPanel?SUB_H+SEP:0),cH=cBot-cTop;
 if(crosshair.x<0||crosshair.x>CW||crosshair.y<cTop||crosshair.y>cBot)return;
 const cx=crosshair.x,cy=crosshair.y;
 const all=state.allCandles;
 if(!all.length)return;
 const VIS=Math.min(Math.max(8,state.visible),all.length);
 const maxOff=Math.max(0,all.length-VIS);
 const clampOff=Math.min(maxOff,Math.max(0,state.offset));
 const end=all.length-clampOff,start=Math.max(0,end-VIS);
 const sub=all.slice(start,end),n=sub.length;
 if(!n)return;
 const pp=sub.flatMap(d=>[d.hi,d.lo]);
 const rawMn=Math.min(...pp),rawMx=Math.max(...pp),pad=(rawMx-rawMn)*0.06;
 const mid2=(rawMn+rawMx)/2;
 const halfRng=((rawMx-rawMn)*0.5+pad)/Math.max(0.1,yScale);
 const mn=mid2-halfRng,mx=mid2+halfRng,rng=mx-mn||1;
 const bw=Math.max(1.5,(CW/n)*0.72);
 const drawW=CW-bw*2-16;
 const ty=logScale&&mn>0&&mx>0?v=>cTop+cH-(Math.log(Math.max(0.01,v)/mn)/Math.log(mx/mn))*cH:v=>cTop+cH-((v-mn)/rng)*cH;
 const tx=i=>bw+(n<=1?drawW/2:(i/(n-1))*(drawW-bw));
 const px2price=y=>mn+((cBot-y)/cH)*rng;
 const cd=crosshair.ci>=0&&_lastRenderedSub?_lastRenderedSub[Math.min(crosshair.ci,_lastRenderedSub.length-1)]:null;
 const isUp=cd?cd.c>=cd.o:true;
 const accentC=isUp?'#22c55e':'#ef4444';
 const accentA=isUp?'rgba(34,197,94,':'rgba(239,68,68,';
 // Crosshair lines
 ctx.strokeStyle=accentC+'55';ctx.lineWidth=0.8;ctx.setLineDash([3,5]);
 ctx.beginPath();ctx.moveTo(cx,cTop);ctx.lineTo(cx,cBot);ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=0.7;
 ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(CW,cy);ctx.stroke();
 ctx.setLineDash([]);
 // Center dot
 ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle=accentC;ctx.fill();
 ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fillStyle=accentA+'0.2)';ctx.fill();
 // Y-axis price badge
 const priceAtY=mn+((cBot-cy)/cH)*rng;
 ctx.fillStyle=accentC;
 ctx.beginPath();ctx.roundRect(CW,cy-10,YW,20,4);ctx.fill();
 ctx.beginPath();ctx.moveTo(CW,cy-5);ctx.lineTo(CW-6,cy);ctx.lineTo(CW,cy+5);ctx.closePath();ctx.fillStyle=accentC;ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 8.5px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(priceAtY.toFixed(2),CW+YW/2,cy);ctx.textBaseline='alphabetic';
 // X-axis time badge
 if(cd){
  const dt2=new Date(cd.t),tfm2=TF_MINS[state.per]||1440;
  const tlbl=tfm2<1440?dt2.getHours()+':'+(dt2.getMinutes()<10?'0':'')+dt2.getMinutes():dt2.getDate()+'/'+(dt2.getMonth()+1);
  const tlw=Math.max(48,ctx.measureText(tlbl).width+16);
  const tlx=Math.max(2,Math.min(CW-tlw-2,cx-tlw/2));
  ctx.fillStyle=accentC;ctx.beginPath();ctx.roundRect(tlx,cBot+4,tlw,16,4);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx-4,cBot+4);ctx.lineTo(cx,cBot);ctx.lineTo(cx+4,cBot+4);ctx.closePath();ctx.fillStyle=accentC;ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(tlbl,tlx+tlw/2,cBot+12);ctx.textBaseline='alphabetic';
 }
}

// TAP-TAP + DRAG DRAWING ENGINE
// 

// Drawing phases: 0=idle, 1=waiting for p2 (tap1 done), 2=drawing (drag active)
let drawPhase = 0;

function isPatternTool(t){return !!(t&&PATTERN_PTS[t]);}


// ── Magnet / Snap to OHLC ──────────────────────────────
let magnetMode = true; // on by default
const MAGNET_RADIUS = 18; // pixels

function snapPt(pt) {
 if(!magnetMode || !state.tool) return pt;
 const b = chartBounds();
 if(pt.x < 0 || pt.x > b.CW || pt.y < b.cTop || pt.y > b.cBot) return pt;
 const all = state.allCandles;
 if(!all.length) return pt;
 const VIS = Math.min(Math.max(8, state.visible), all.length);
 const maxOff = Math.max(0, all.length - VIS);
 const off = Math.min(maxOff, Math.max(0, state.offset));
 const end = all.length - off, start = Math.max(0, end - VIS);
 const sub = all.slice(start, end), n = sub.length;
 if(!n) return pt;
 const drawW = b.CW - b.bw*2 - 16;
 const tx = i => b.bw + (n<=1 ? drawW/2 : (i/(n-1))*(drawW-b.bw));
 // Price range (linear only for snap)
 const pp = sub.flatMap(d=>[d.hi,d.lo]);
 const rawMn=Math.min(...pp), rawMx=Math.max(...pp), pad=(rawMx-rawMn)*0.06;
 const mid=(rawMn+rawMx)/2;
 const halfRng=((rawMx-rawMn)*0.5+pad)/Math.max(0.1,yScale);
 const mn=mid-halfRng, rng=(mid+halfRng-mn)||1;
 const cH = b.cBot - b.cTop;
 const ty = v => b.cTop + cH - ((v - mn) / rng) * cH;
 // Find nearest candle
 let bestDist = MAGNET_RADIUS * MAGNET_RADIUS;
 let snapX = pt.x, snapY = pt.y;
 sub.forEach((d, i) => {
  const cx = tx(i);
  const dx = pt.x - cx;
  if(Math.abs(dx) > MAGNET_RADIUS * 1.5) return; // skip far candles
  [d.o, d.hi, d.lo, d.c].forEach(price => {
   const cy = ty(price);
   const dist = dx*dx + (pt.y-cy)*(pt.y-cy);
   if(dist < bestDist) {
    bestDist = dist;
    snapX = cx;
    snapY = cy;
   }
  });
 });
 return {x: snapX, y: snapY};
}
function startDrawing(pt) {
 if(isPatternTool(state.tool)){
 patPts=[{x:pt.x,y:pt.y}];
 patTool=state.tool;
 state.live={id:Date.now(),tool:state.tool,pts:[{x:pt.x,y:pt.y}],p1:{x:pt.x,y:pt.y},p2:{x:pt.x,y:pt.y},color:state.drawColor};
 drawPhase=1;drMode=null;
 updateDrawBtn();render();return;
 }
 const _sp=snapPt(pt);
 state.live={id:Date.now(),tool:state.tool,p1:{x:_sp.x,y:_sp.y},p2:{x:_sp.x,y:_sp.y},color:state.drawColor};
 drawPhase=1;drMode='draw';render();
}

function updateP2(pt) {
 if(state.live) {
 const _up=snapPt(pt);
 state.live.p2 = {x:_up.x, y:_up.y};

 }

function _enrichDrawing(d){
  // Store price-based coordinates for persistence across sessions
  // Called after adding any drawing to state.drawings
  try{
    const all=state.allCandles;
    const n=all.length;
    if(!n)return;
    const vis=state.visible,off=state.offset;
    const start=n-vis-off,end2=n-off;
    const W=cv.offsetWidth-38||352;
    const drawW=W-8;
    const bw=Math.max(1.5,(W/Math.max(1,vis))*0.72);
    const _subLen=end2-start;
    // px → candle index
    const px2idx=(px)=>Math.round((px-bw)/Math.max(0.1,drawW/Math.max(1,_subLen-1)));
    // py → price (approximate linear)
    const ch=cv.offsetHeight-22-3-Math.round((cv.offsetHeight-22-3)*0.11)||500;
    const cTop=12;
    const allVisible=all.slice(start,end2);
    if(!allVisible.length)return;
    const pp=allVisible.flatMap(c=>[c.hi,c.lo]);
    const rawMn=Math.min(...pp),rawMx=Math.max(...pp);
    const pad=(rawMx-rawMn)*0.06;
    const mn=rawMn-pad,rng=(rawMx-rawMn+pad*2)||1;
    const cH=ch-cTop-3;
    const cBot=cTop+cH;
    const py2price=(py)=>mn+((cBot-py)/cH)*rng;
    if(d.p1){
      const ci=Math.max(0,Math.min(_subLen-1,px2idx(d.p1.x)));
      d._p1_price=py2price(d.p1.y);
      d._p1_idx=start+ci;
    }
    if(d.p2){
      const ci=Math.max(0,Math.min(_subLen-1,px2idx(d.p2.x)));
      d._p2_price=py2price(d.p2.y);
      d._p2_idx=start+ci;
    }
  }catch(e){}
}
function finishDrawing(pt) {
 // Pattern tool: add point
 if((isPatternTool(state.tool))&&state.live){
 if(pt)patPts.push({x:pt.x,y:pt.y});
 const total=(PATTERN_PTS[state.tool]||2);
 state.live.pts=[...patPts];
 state.live.p2=patPts[patPts.length-1]||state.live.p1;
 updateDrawBtn();
 if(patPts.length>=total){
 const d={id:Date.now(),tool:state.tool,pts:[...patPts],p1:patPts[0],p2:patPts[patPts.length-1],color:state.drawColor};
 _hist();state.drawings.push(d);_enrichDrawing(d);drSelId=d.id;
 patPts=[];patTool=null;state.live=null;state.tool=null;
 drawPhase=0;drMode=null;updateDrawBtn();showDrawToolbar();
 } else {
 // Keep collecting — ensure drawPhase stays 1
 drawPhase=1;drMode=null;
 }
 render();return;
 }
 if(!state.live)return;
 const d=state.live;
 if(pt){const _fp=snapPt(pt);d.p2={x:_fp.x,y:_fp.y};}
 const singlePt=['hline','vline','hbrush'];
 const dist=Math.hypot(d.p2.x-d.p1.x,d.p2.y-d.p1.y);
 if(singlePt.includes(d.tool)){
 if(d.tool==='hline'){d.p1.x=0;d.p2={x:cv.offsetWidth-38,y:d.p1.y};}
 if(d.tool==='vline'){d.p2={x:d.p1.x,y:cv.offsetHeight};}
 
 if(d.tool==='hbrush'){d.p1.x=0;d.p2={x:cv.offsetWidth-38,y:d.p1.y+30};d.brushColor=d.brushColor||'#fbbf24';d.brushAlpha=d.brushAlpha||0.15;}
 _hist();state.drawings.push(d);_enrichDrawing(d);drSelId=d.id;
 } else if(dist>5){
 _hist();state.drawings.push(d);_enrichDrawing(d);drSelId=d.id;
 }
 state.live=null;state.tool=null;drawPhase=0;drMode=null;
 updateDrawBtn();showDrawToolbar();saveDrawings();_updateUndoButtons();render();
 // Auto-open editors for relevant tools
 if(d.tool==='text'||d.tool==='callout'){
  setTimeout(()=>showTextEditor(d),100);
 }

}

 state.live=null;state.tool=null;drawPhase=0;drMode=null;

}

// ── تجميع الشموع اليومية إلى أسبوعية/شهرية ──────────────────────
// سهمك يوفّر بيانات يومية فقط (endpoint: historical).
// للفريمات الأكبر نجمّع محلياً: فتح أول يوم، إغلاق آخر يوم، أعلى/أدنى الكل، مجموع الحجم.
function _aggregateCandles(daily, mode){
 if((mode!=='1W' && mode!=='1M') || !Array.isArray(daily) || daily.length<2) return daily;
 const groups={};
 const order=[];
 daily.forEach(c=>{
  const dt = c.t instanceof Date ? c.t : new Date(c.t);
  if(isNaN(dt)) return;
  let key;
  if(mode==='1W'){
   // مفتاح الأسبوع: السنة + رقم الأسبوع (ISO تقريبي)
   const onejan=new Date(dt.getFullYear(),0,1);
   const week=Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7);
   key=dt.getFullYear()+'-W'+week;
  } else {
   key=dt.getFullYear()+'-'+dt.getMonth();
  }
  if(!groups[key]){ groups[key]=[]; order.push(key); }
  groups[key].push(c);
 });
 return order.map(k=>{
  const g=groups[k];
  return {
   o:  g[0].o,
   c:  g[g.length-1].c,
   hi: Math.max(...g.map(x=>x.hi)),
   lo: Math.min(...g.map(x=>x.lo)),
   v:  g.reduce((s,x)=>s+(x.v||0),0),
   t:  g[g.length-1].t
  };
 });
}
