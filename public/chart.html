<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>تداول+</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#070b12;font-family:'Cairo',sans-serif;direction:rtl}
#hdr{width:100%;background:#070a12;border-bottom:1px solid #0f1520;position:relative;z-index:10}
#r1{display:flex;align-items:center;padding:8px 10px;gap:8px;min-height:52px;border-bottom:1px solid rgba(255,255,255,0.03)}
#r2{display:flex;align-items:center;padding:6px 10px 7px;gap:5px;overflow-x:auto;scrollbar-width:none;background:#0d1120;flex-wrap:nowrap;border-top:1px solid #1a2235}
#r2::-webkit-scrollbar{display:none}
#chart-wrap{position:absolute;left:0;right:0;bottom:0;overflow:visible;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none;cursor:crosshair}
button{font-family:'Cairo',sans-serif;cursor:pointer;outline:none}
.btn{display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent;border-radius:9px;padding:5px 9px;color:#3a4560;font-size:11px;white-space:nowrap;flex-shrink:0}
.ibtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#1a2235;border:1px solid #2a3a55;border-radius:12px;cursor:pointer;padding:7px 5px 6px;min-width:52px;height:54px;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.ibtn svg{width:22px;height:17px;flex-shrink:0;}
.ibtn span{font-size:9.5px;font-family:Cairo,sans-serif;color:#7090b0;line-height:1;white-space:nowrap;}
.ibtn:active{opacity:0.7;}
.ibtn.active{background:#0d2040;border-color:#3b9eff;}
.ibtn.active svg line,.ibtn.active svg polyline,.ibtn.active svg path,.ibtn.active svg rect,.ibtn.active svg circle,.ibtn.active svg polygon{stroke:#3b9eff !important;}
.ibtn.active span{color:#3b9eff;}
.ibtn-sm{min-width:36px;}
.ibtn-sm svg{width:19px;}
.btn.active{border-color:var(--c,#3b9eff)40;background:var(--c,#3b9eff)12;color:var(--c,#3b9eff)}
.sep{width:1px;height:20px;background:#141824;flex-shrink:0;margin:0 2px}
#per-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:5px 11px;color:#ccd4ee;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:4px}
#per-btn.open{border-color:rgba(59,158,255,0.4);background:rgba(59,158,255,0.12);color:#3b9eff}
#per-menu{position:fixed;background:#08101c;border:1px solid #1e2d42;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,0.9);padding:8px;display:none;flex-wrap:wrap;gap:4px;width:188px;z-index:999}
#per-menu.open{display:flex}
#range-menu{position:fixed;background:#08101c;border:1px solid #1e2d42;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,0.9);padding:8px;display:none;flex-wrap:wrap;gap:4px;width:188px;z-index:999}
#range-menu.open{display:flex}

.pmenu-item{flex:1;min-width:46px;text-align:center;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 4px;color:#4a5570;font-size:12px;font-weight:600}
.pmenu-item.active{color:#3b9eff;background:rgba(59,158,255,0.14);border-color:rgba(59,158,255,0.3);font-weight:700}
#ct-menu{position:fixed;background:#08101c;border:1px solid #1e2d42;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,0.9);padding:6px;display:none;flex-direction:column;gap:2px;min-width:130px;z-index:999}
#ct-menu.open{display:flex}
.ctitem{background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 14px;color:#4a5570;font-size:12px;text-align:right;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctitem.active{color:#3b9eff;background:rgba(59,158,255,0.12);border-color:rgba(59,158,255,0.25);font-weight:700}
#badge{background:#081728;border:1.5px solid #0f3860;border-radius:7px;padding:3px 8px 4px;display:inline-flex;flex-direction:column;align-items:center;min-width:42px;cursor:pointer}
#sym-code{font-size:12px;font-weight:900;color:#4ab0ff;line-height:1.15}
#sym-sar{font-size:7px;color:#0e3560;letter-spacing:.7px}
#stk-name{font-size:15px;font-weight:700;color:#e8ecf4;cursor:pointer;margin-right:8px}
#pw{margin-right:auto;display:flex;align-items:center;gap:7px;direction:ltr}
#pmain{font-size:22px;font-weight:900;color:#fff;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#pch{font-size:12px;font-weight:700}
#ppct{font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;border:1px solid}
/* Sheets */
#sbg{position:fixed;inset:0;background:rgba(3,6,12,0.75);z-index:100;display:none;pointer-events:none}
#sbg.show{display:block;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#080d1a;border-radius:18px 18px 0 0;border:1px solid #141824;max-height:85vh;display:flex;flex-direction:column;z-index:101;transform:translateY(100%);transition:transform .25s ease;pointer-events:none;height:85vh}
.sheet.show{transform:translateY(0);pointer-events:auto}
.sh{width:36px;height:4px;background:#1a2030;border-radius:2px;margin:12px auto 4px}
.shdr{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 10px}
.stit{font-size:14px;font-weight:800;color:#edf1f8}
.scls{background:none;border:none;color:#ef4444;font-size:11px}
.sbody{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sfoot{padding:10px 12px;border-top:1px solid #141824;flex-shrink:0;display:flex;gap:8px}
.fbtn{flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:700;border-width:1px;border-style:solid}
/* Indicators */
.icat{padding:7px 16px;background:#050910;font-size:9px;font-weight:700;color:#3a4060;letter-spacing:.7px}
.irow{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid #0c1020;cursor:pointer;background:transparent;width:100%;border-left:none;border-right:none;border-top:none}
.ichk{width:22px;height:22px;border-radius:6px;background:#0c1020;border:1px solid #141828;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.idot{width:3px;height:14px;border-radius:2px;margin-right:8px;flex-shrink:0}
.ilbl{font-size:12px;color:#7a8298}
/* Stocks */
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #0c1020;cursor:pointer;background:transparent;width:100%;border-left:none;border-right:none;border-top:none}
/* Draw cats */
.dcat{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid #0d1420;cursor:pointer;background:transparent;width:100%;border-left:none;border-right:none;border-top:none}
.dcat-t{font-size:14px;color:#c8d4e8;font-weight:500}
.dcat-a{font-size:12px;color:#3a4560;transition:transform .2s}
.dcat.open .dcat-a{transform:rotate(90deg)}
.ditems{display:none;flex-direction:column;background:#050910}
.ditems.open{display:flex}
.dtool{display:flex;align-items:center;justify-content:space-between;padding:11px 20px 11px 16px;border-bottom:1px solid #0a1018;cursor:pointer;background:transparent;width:100%;border-left:none;border-right:none;border-top:none;gap:10px}
.dtool.active{background:rgba(59,158,255,0.1)}
.dtool-l{display:flex;align-items:center;gap:10px}
.dtool-ic{font-size:16px;width:24px;text-align:center;flex-shrink:0}
.dtool-n{font-size:12px;color:#8a9ab8}
.dtool.active .dtool-n{color:#3b9eff;font-weight:700}
/* AI panel */
#aip{position:fixed;inset:0;background:rgba(4,7,14,0.97);z-index:200;display:none;flex-direction:column;pointer-events:none}
#aip.show{display:flex;pointer-events:auto}
.aic{background:#080d18;border-radius:10px;border:1px solid #141824;overflow:hidden;margin-bottom:6px}
.aich{padding:7px 12px;border-bottom:1px solid #141824;background:#060a14;font-size:9px;font-weight:700;color:#3a4060}
.aib{padding:10px 12px}
/* Toast */
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(5,12,20,0.95);border:1px solid rgba(29,184,138,0.4);border-radius:10px;padding:7px 16px;color:#1db88a;font-size:12px;pointer-events:none;display:none;z-index:5;white-space:nowrap}
#toast.show{display:block}
/* Draw ctx menu */
#dctx{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:36px;height:36px;border:3px solid rgba(167,139,250,0.2);border-top:3px solid #a78bfa;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
/* Draw menu buttons */
#dtb button:active{opacity:0.7;transform:scale(0.95)}
#dtb-color-btn:active{transform:scale(0.92)}
#draw-color-swatches button:hover{transform:scale(1.2)}
#draw-color-swatches button:active{transform:scale(0.9)}

/* ── Landscape / iPad Optimization ── */
@media (orientation: landscape) and (max-height: 500px) {
  #r1 { min-height: 38px !important; padding: 4px 10px !important; }
  #r1 #pmain { font-size: 16px !important; }
  #r1 #stk-name { font-size: 12px !important; }
  #r2 { padding: 3px 8px 4px !important; }
  .ibtn { height: 42px !important; min-width: 44px !important; padding: 4px 3px 4px !important; }
  .ibtn svg { width: 18px !important; height: 14px !important; }
  .ibtn span { font-size: 8px !important; }
  #btn-theme { width: 36px !important; height: 36px !important; }
}
@media (min-width: 768px) {
  /* iPad portrait/landscape */
  .ibtn { min-width: 64px !important; height: 62px !important; padding: 9px 8px 8px !important; }
  .ibtn svg { width: 26px !important; height: 20px !important; }
  .ibtn span { font-size: 11px !important; }
  #r1 #pmain { font-size: 26px !important; }
  #r1 #stk-name { font-size: 18px !important; }
  #r2 { gap: 8px !important; padding: 8px 14px 9px !important; }
  #per-btn { height: 62px !important; padding: 0 18px !important; font-size: 15px !important; }
  #btn-theme { width: 54px !important; height: 54px !important; border-radius: 14px !important; }
  #badge { padding: 5px 10px !important; border-radius: 10px !important; }
  #sym-code { font-size: 15px !important; }
}

 @keyframes wavePopIn {
  from { opacity:0; transform:scale(0.85) translateY(6px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
 }
 @keyframes obPulse {
  0%,100% { box-shadow: 0 0 0 4px rgba(59,158,255,0.25), 0 0 20px rgba(59,158,255,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(59,158,255,0.1), 0 0 30px rgba(59,158,255,0.6); }
 }
 @keyframes chartSpin {
  to { transform: rotate(360deg); }
 }
 #chart-loader.visible {
  opacity: 1 !important;
  pointer-events: auto !important;
 }
</style>
</head>
<body>
<div id="hdr">
 <div id="r1">
<button onclick="window.parent.postMessage('closeChart','*')" style="background:#1a2235;border:1px solid #2a3a55;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex-shrink:0;touch-action:manipulation;color:#f0f6ff;font-size:16px;-webkit-tap-highlight-color:transparent;margin-left:8px;">✕</button>
<div id="badge" onclick="openSheet('stock')">
  <span id="sym-code">2010</span>
  <span id="sym-sar">SAR</span>
</div>

 <span id="stk-name" onclick="openSheet('stock')">سابك</span>
 <div id="pw">
  <span id="pmain">103.20</span>
  <span id="pch">+2.46</span>
  <span id="ppct">+2.38%</span>
 </div>
 <button id="btn-theme"  style="background:#1a2235;border:1px solid #2a3a55;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin-right:auto;-webkit-tap-highlight-color:transparent;flex-shrink:0;touch-action:manipulation;" title="السمة">
  <svg id="theme-icon" viewBox="0 0 24 24" fill="none" width="22" height="22">
    <!-- Moon: crescent shape -->
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="#a5b4fc" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
</div>
<div id="cam-menu" style="display:none;position:fixed;background:rgba(6,10,22,0.97);border:1px solid rgba(255,255,255,0.12);border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.95);padding:8px;z-index:9999;min-width:230px;">

<!-- PNG (حفظ داخل التطبيق) -->
 <div style="display:flex;align-items:center;gap:4px">
  <button onclick="doSnap();closeCamMenu()" style="flex:1;background:transparent;border:none;padding:10px 14px;color:#c0d0e8;font-size:13px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:9px;box-sizing:border-box;display:flex;align-items:center;gap:8px;direction:rtl"><span style="font-size:15px">📸</span>حفظ لقطة بالتطبيق</button>
  <button onclick="showCamHelp('png')" style="width:22px;height:22px;border-radius:50%;background:rgba(59,158,255,0.1);border:1px solid rgba(59,158,255,0.2);color:#3b9eff;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:6px;padding:0">?</button>
 </div>

 <div style="height:1px;background:rgba(255,255,255,0.06);margin:3px 6px"></div>

 <!-- مشاركة -->
 <div style="display:flex;align-items:center;gap:4px">
  <button onclick="shareChartImage();closeCamMenu()" style="flex:1;background:transparent;border:none;padding:10px 14px;color:#3b9eff;font-size:13px;font-family:Cairo,sans-serif;text-align:right;cursor:pointer;border-radius:9px;box-sizing:border-box;display:flex;align-items:center;gap:8px;direction:rtl"><span style="font-size:15px">📤</span>مشاركة</button>
 </div>


</div>
 <div id="r2">
  <!-- Period selector (keep small) -->
  <button id="per-btn" onclick="togglePerMenu()" style="background:#1a2235;border:1px solid #2a3a55;border-radius:12px;color:#c0d0e8;font-size:13px;font-weight:700;padding:0 14px;height:54px;cursor:pointer;font-family:Cairo,sans-serif;flex-shrink:0">1D</button>
<button id="range-btn" onclick="toggleRangeMenu()" style="background:#1a2235;border:1px solid #2a3a55;border-radius:12px;color:#7a90b0;font-size:13px;font-weight:700;padding:0 14px;height:54px;cursor:pointer;font-family:Cairo,sans-serif;flex-shrink:0">سنة</button>
  <!-- Icon buttons row -->
  <div class="sep"></div>

  <!-- Chart Type -->
<button id="ct-btn" class="ibtn" onclick="toggleCtMenu()" title="نوع الشارت">
    <svg viewBox="0 0 28 20" fill="none"><line x1="7" y1="2" x2="7" y2="6" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round"/><rect x="4.5" y="6" width="5" height="8" rx="0.8" stroke="#5eead4" stroke-width="1.4" fill="none"/><line x1="7" y1="14" x2="7" y2="18" stroke="#5eead4" stroke-width="1.4" stroke-linecap="round"/><line x1="17" y1="1" x2="17" y2="6" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round"/><rect x="14.5" y="6" width="5" height="9" rx="0.8" fill="#5eead4" opacity="0.9"/><line x1="17" y1="15" x2="17" y2="19" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span></span>
  </button>

  <!-- Indicators -->
  <button id="btn-ind" class="ibtn" onclick="openSheet('ind');setTimeout(()=>{const b=document.getElementById('btn-of-sheet');if(b){b.style.background=showOrderFlow?'rgba(34,197,94,0.15)':'rgba(255,255,255,0.05)';b.style.borderColor=showOrderFlow?'rgba(34,197,94,0.4)':'rgba(255,255,255,0.1)';b.style.color=showOrderFlow?'#22c55e':'#94a3b8';}},50)" title="مؤشرات">
    <svg viewBox="0 0 28 20" fill="none"><polyline points="2,16 8,8 14,11 20,4 26,6" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 4 L26 4 L26 8" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>مؤشرات<i id="ind-n" style="background:#3b9eff;color:#000;border-radius:8px;font-size:7px;font-weight:900;padding:0 4px;display:none;font-style:normal;margin-right:2px">0</i></span>
  </button>

  <!-- Strategies -->
  <button id="btn-strat" class="ibtn" onclick="openSheet('strat')" title="استراتيجيات">
    <svg viewBox="0 0 28 20" fill="none"><line x1="4" y1="6" x2="24" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="11" x2="24" y2="11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="16" x2="16" y2="16" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>استراتيجيات</span>
  </button>

  <!-- Draw -->
  <button id="btn-draw" class="ibtn" onclick="openSheet('draw')" title="رسم">
    <svg viewBox="0 0 28 22" fill="none"><path d="M5 17 L10 7 L18 14 L23 5" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="7" r="1.5" fill="#94a3b8"/><circle cx="18" cy="14" r="1.5" fill="#94a3b8"/></svg>
    <span>رسم<i id="draw-badge" style="background:#3b9eff;color:#000;border-radius:8px;font-size:7px;font-weight:900;padding:0 4px;display:none;font-style:normal;margin-right:2px">0</i></span>
  </button>

  <!-- Undo/Redo (compact) -->
  <button id="btn-undo" class="ibtn ibtn-sm" onclick="undoDraw()" ontouchend="event.preventDefault();undoDraw();" title="تراجع">
    <svg viewBox="0 0 22 22" fill="none"><path d="M4 11 C4 7 7 4 11 4 C15 4 18 7 18 11 C18 15 15 18 11 18" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/><polyline points="4,7 4,11 8,11" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span></span>
  </button>
  <button id="btn-redo" class="ibtn ibtn-sm" onclick="redoDraw()" ontouchend="event.preventDefault();redoDraw();" title="إعادة">
    <svg viewBox="0 0 22 22" fill="none"><path d="M18 11 C18 7 15 4 11 4 C7 4 4 7 4 11 C4 15 7 18 11 18" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round"/><polyline points="18,7 18,11 14,11" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span></span>
  </button>

  <!-- Alert -->
  <button id="btn-alert" class="ibtn" onclick="openSheet('alert')" title="تنبيه">
    <svg viewBox="0 0 28 22" fill="none"><path d="M14 3 C9 3 6 7 6 11 L6 15 L4 17 L24 17 L22 15 L22 11 C22 7 19 3 14 3Z" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-linejoin="round"/><path d="M11 17 C11 18.7 12.3 20 14 20 C15.7 20 17 18.7 17 17" stroke="#94a3b8" stroke-width="1.3" fill="none"/></svg>
    <span>تنبيه</span>
  </button>

  <!-- AI -->
  <button id="btn-ai" class="ibtn" onclick="showAI()" title="AI">
    <svg viewBox="0 0 28 22" fill="none"><path d="M14 4 L17 10 L23 11 L18.5 15.5 L19.5 22 L14 19 L8.5 22 L9.5 15.5 L5 11 L11 10 Z" stroke="#94a3b8" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
    <span>AI</span>
  </button>

  <!-- Replay -->

  <button id="btn-replay" class="ibtn" onclick="toggleReplay()" title="إعادة تشغيل">
    <svg viewBox="0 0 28 22" fill="none">
      <polygon points="7,3 21,11 7,19" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
    </svg>
    <span>تشغيل</span>
  </button>

  <!-- Compare + Calendar — آخر يسار الصف -->
  <button class="ibtn" onclick="showCompareModal()" title="مقارنة">
    <svg viewBox="0 0 28 22" fill="none"><polyline points="2,16 6,9 10,12 14,5 18,8 22,6" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polyline points="2,19 6,14 10,17 14,11 18,14 22,12" stroke="#f59e0b" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,2"/></svg>
    <span>قارن</span>
  </button>

  <!-- Camera — آخر زر يساراً -->
  <button id="btn-cam" class="ibtn" onclick="toggleCamMenu()" title="لقطة">

// ── roundRect polyfill for Safari/iOS ─

if(!CanvasRenderingContext2D.prototype.roundRect){
 CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
  if(w<2*r)r=w/2;if(h<2*r)r=h/2;
  this.beginPath();
  this.moveTo(x+r,y);
  this.arcTo(x+w,y,x+w,y+h,r);
  this.arcTo(x+w,y+h,x,y+h,r);
  this.arcTo(x,y+h,x,y,r);
  this.arcTo(x,y,x+w,y,r);
  this.closePath();
  return this;
 };
}

// ── Indicator Alert System ──────────────────────────────
let indAlerts = []; // [{id, indId, condition, value, active, fired}]

function _checkIndAlerts(){
 if(!indAlerts.length) return;
 const _cr = _indCache.results;
 const _mcd = _indCache.mcd;
 if(!_cr) return;
 const all = state.allCandles;
 if(!all.length) return;
 const last = all.length - 1;

 indAlerts.forEach(al => {
  if(!al.active || al.fired) return;
  let curVal = null;
  const prev = al._prev;

  if(al.indId === 'RSI' && _cr.rsi) curVal = _cr.rsi[last];
  else if(al.indId === 'MACD' && _mcd) curVal = _mcd.hist[last];
  else if(al.indId === 'RSI_DIV') return; // handled separately
  else if(al.indId === 'STOCH' && _indCache.stochD) curVal = _indCache.stochD[last];
  else if(al.indId === 'MA_CROSS'){
   const _e9=_indCache.results?.ema9,_e21=_indCache.results?.ema20;
   if(!_e9||!_e21)return;
   const _cv9=_e9[last],_pv9=_e9[last-1],_cv21=_e21[last],_pv21=_e21[last-1];
   if(_cv9==null||_pv9==null||_cv21==null||_pv21==null)return;
   const _t2=(al.condition==='cross_up'&&_pv9<=_pv21&&_cv9>_cv21)||(al.condition==='cross_dn'&&_pv9>=_pv21&&_cv9<_cv21);
   if(_t2){al.fired=true;const _lbl='MA9/MA21 '+(al.condition==='cross_up'?'تقاطع صعودي ↑':'تقاطع هبوطي ↓');sendNotif('تنبيه',_lbl);const _t=document.getElementById('toast');if(_t){_t.textContent='⬤ '+_lbl;_t.style.display='block';_t.classList.add('show');setTimeout(()=>{_t.classList.remove('show');_t.style.display='none';},3000);}setTimeout(()=>{al.fired=false;},2000);}
   return;
  }
  else if(al.indId === 'PRICE_MA'){
   const _m50=_indCache.results?.ma50;
   if(!_m50)return;
   const _pc=all[last]?.c,_pp=all[last-1]?.c,_m50c=_m50[last],_m50p=_m50[last-1];
   if(_pc==null||_pp==null||_m50c==null||_m50p==null)return;
   const _t3=(al.condition==='cross_up'&&_pp<=_m50p&&_pc>_m50c)||(al.condition==='cross_dn'&&_pp>=_m50p&&_pc<_m50c);
   if(_t3){al.fired=true;const _lbl='السعر '+(al.condition==='cross_up'?'تجاوز MA50 ↑':'هبط تحت MA50 ↓');sendNotif('تنبيه',_lbl);const _t=document.getElementById('toast');if(_t){_t.textContent='⬤ '+_lbl;_t.style.display='block';_t.classList.add('show');setTimeout(()=>{_t.classList.remove('show');_t.style.display='none';},3000);}setTimeout(()=>{al.fired=false;},2000);}
   return;
  }

  if(curVal == null) return;
  al._prev = curVal;

  const triggered =
   al.condition === 'above'   ? prev != null && prev <= al.value && curVal > al.value :
   al.condition === 'below'   ? prev != null && prev >= al.value && curVal < al.value :
   al.condition === 'cross_up'? prev != null && prev < 0 && curVal >= 0 :
   al.condition === 'cross_dn'? prev != null && prev > 0 && curVal <= 0 : false;

  if(triggered){
   al.fired = true;
   const lbl = al.indId + (al.condition.includes('cross') ? ' تقاطع' : (al.condition==='above'?' فوق ':' تحت ')+al.value);
   sendNotif('تنبيه مؤشر', lbl);
   const t = document.getElementById('toast');
   if(t){t.textContent='⬤ '+lbl;t.style.display='block';t.classList.add('show');setTimeout(()=>{t.classList.remove('show');t.style.display='none';},3000);}
   // Auto-reset after 1 candle to allow re-triggering
   setTimeout(()=>{al.fired=false;}, 2000);
  }
 });
}

function _evalCustomInd(formula, allC, allH, allL, allV){
 try {
  // Build sandbox with available data + functions
  const _sandbox = {
   close: allC, high: allH, low: allL, volume: allV,
   // Math helpers
   abs: Math.abs, max: Math.max, min: Math.min,
   sqrt: Math.sqrt, pow: Math.pow, log: Math.log,
   // Indicator functions (all return arrays same length as input)
   SMA: (src,n)=>sma(src,n),
   EMA: (src,n)=>ema(src,n),
   RSI: (src,n=14)=>rsi(src,n),
   BB:  (src,n=20,k=2)=>bb(src,n,k),
   ATR: (n=14)=>calcATR_data({map:(fn)=>allC.map((_,i)=>({c:allC[i],hi:allH[i],lo:allL[i]}))},n),
   OBV: ()=>obv(allC,allV),
   MACD:(src,f=12,s=26,sg=9)=>macd(src,f,s,sg),
   // Arithmetic on arrays
   ADD: (a,b)=>a.map((v,i)=>v==null||b[i]==null?null:v+b[i]),
   SUB: (a,b)=>a.map((v,i)=>v==null||b[i]==null?null:v-b[i]),

   // Shift array
   SHIFT: (a,n)=>a.map((_,i)=>i<n?null:a[i-n]),
   // Cross detection (returns 1 on cross up, -1 on cross down, 0 otherwise)
   CROSS: (a,b)=>a.map((_,i)=>{

    if(a[i-1]<=b[i-1]&&a[i]>b[i])return 1;
    if(a[i-1]>=b[i-1]&&a[i]<b[i])return -1;
    return 0;
   }),
   // Clamp array values
   CLAMP: (a,mn,mx)=>a.map(v=>v==null?null:Math.max(mn,Math.min(mx,v))),
   // Number of candles
   N: allC.length,

ohlc4: allH.map((h,i)=>((allC[i-1]??allC[i])+h+allL[i]+allC[i])/4),

   WMA: (src,n)=>src.map((_,i)=>i<n-1?null:src.slice(i-n+1,i+1).reduce((s,v,j)=>s+v*(j+1),0)/(n*(n+1)/2)),
   DEMA: (src,n)=>{const e1=ema(src,n);const e2=ema(e1,n);return e1.map((v,i)=>v==null||e2[i]==null?null:2*v-e2[i]);},

   // Momentum indicators
   MOM: (src,n=10)=>src.map((v,i)=>i<n||v==null||src[i-n]==null?null:v-src[i-n]),
   ROC: (src,n=10)=>src.map((v,i)=>i<n||v==null||src[i-n]==null||src[i-n]===0?null:(v-src[i-n])/src[i-n]*100),
   CCI: (n=20)=>{const tp=allH.map((h,i)=>(h+allL[i]+allC[i])/3);return tp.map((_,i)=>{if(i<n-1)return null;const sl=tp.slice(i-n+1,i+1);const m=sl.reduce((a,b)=>a+b,0)/n;const d=sl.reduce((a,v)=>a+Math.abs(v-m),0)/n;return d===0?0:(tp[i]-m)/(0.015*d);});},
   CMO: (src,n=14)=>src.map((_,i)=>{if(i<n)return null;let u=0,d=0;for(let k=i-n+1;k<=i;k++){const diff=src[k]-(src[k-1]??src[k]);diff>0?u+=diff:d-=diff;}return u+d===0?0:(u-d)/(u+d)*100;}),
   // Volume indicators
   CMF: (n=20)=>{const mf=allH.map((h,i)=>{const r=h-allL[i]||0.001;return((allC[i]-allL[i])-(h-allC[i]))/r*allV[i];});return mf.map((_,i)=>{if(i<n-1)return null;const sv=allV.slice(i-n+1,i+1).reduce((a,b)=>a+b,0);return sv===0?0:mf.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/sv;});},
   // Statistical
   STDEV: (src,n=20)=>src.map((_,i)=>{if(i<n-1)return null;const sl=src.slice(i-n+1,i+1).filter(v=>v!=null);const m=sl.reduce((a,b)=>a+b,0)/sl.length;return Math.sqrt(sl.reduce((a,v)=>a+(v-m)**2,0)/sl.length);}),
   HIGHEST: (src,n=20)=>src.map((_,i)=>i<n-1?null:Math.max(...src.slice(i-n+1,i+1).filter(v=>v!=null))),
   LOWEST: (src,n=20)=>src.map((_,i)=>i<n-1?null:Math.min(...src.slice(i-n+1,i+1).filter(v=>v!=null))),
   ABS: (a)=>Array.isArray(a)?a.map(v=>v==null?null:Math.abs(v)):Math.abs(a),
   SQRT: (a)=>Array.isArray(a)?a.map(v=>v==null?null:Math.sqrt(Math.abs(v))):Math.sqrt(Math.abs(a)),
   MAX: (a,b)=>Array.isArray(a)?a.map((v,i)=>v==null||(Array.isArray(b)&&b[i]==null)?null:Math.max(v,Array.isArray(b)?b[i]:b)):Math.max(a,b),
   MIN: (a,b)=>Array.isArray(a)?a.map((v,i)=>v==null||(Array.isArray(b)&&b[i]==null)?null:Math.min(v,Array.isArray(b)?b[i]:b)):Math.min(a,b),

  // Build function from formula
  // ── Security: blacklist dangerous patterns ──
  const dangerousPatterns = /\b(fetch|XMLHttpRequest|import|eval|Function|require|process|window|document|globalThis|self|parent|top|location|navigator|localStorage|sessionStorage|indexedDB|cookie|alert|prompt|confirm|setTimeout|setInterval|Worker|postMessage|FileReader|Blob)\b/i;
  if(dangerousPatterns.test(formula)) return null;

  if(formula.length > 500) return null;
  
  const keys = Object.keys(_sandbox);
  const vals = Object.keys(_sandbox).map(k=>_sandbox[k]);
  const fn = new Function(...keys, `"use strict"; return (${formula});`);
  const result = fn(...vals);

  // Result must be an array
  if(!Array.isArray(result)) return null;
  return result;
 } catch(e) {
  return null; // silent fail
 }

function getPanelH(key, H, defaultPct){
 const pct = panelSizes[key] !== undefined ? panelSizes[key] : defaultPct;
 return Math.round(H * Math.max(PANEL_MIN_PCT, Math.min(PANEL_MAX_PCT, pct)));

// ── Order Flow (Delta Volume) ────────────────────────────
// Mock: estimates delta from candle body position
// Real API: replace _calcOrderFlow with actual tick data
let showOrderFlow = false;

function _calcOrderFlow(candles){
 // Delta estimation using CLV (Close Location Value) — industry standard for OHLCV
 // buyRatio = (close - low) / (high - low)
 // Ranges 0 (close at low = all selling) to 1 (close at high = all buying)
 // Bias < 1.5% on random data — academically accepted method
 return candles.map(d=>{
  const range = d.hi - d.lo || 0.001;
  const o = d.o || d.c;
  // CLV: primary signal from close position
  const clv = (d.c - d.lo) / range;
  // Blend with open position for direction bias
  const openLoc = (o - d.lo) / range;
  // Weighted: 60% close location, 40% open location (open shows intent)
  const buyRatio = Math.min(0.95, Math.max(0.05, clv * 0.6 + openLoc * 0.4));
  const buyVol = Math.round(d.v * buyRatio);
  const sellVol = d.v - buyVol;
  const delta = buyVol - sellVol;
  const deltaPct = delta / (d.v || 1) * 100;
  return { buyVol, sellVol, delta, deltaPct, cumDelta: 0 };
 }).map((d,i,arr)=>{
  d.cumDelta = i===0 ? d.delta : arr[i-1].cumDelta + d.delta;
  return d;
 });
}

async function _fetchOrderFlow(sym, per){
 // Try real API first
 const apiData = await API_CONFIG.fetch('orderflow', {sym, per});
 if(apiData) return apiData;
 // Fallback to calculated estimate
 return _calcOrderFlow(state.allCandles);
}

function _renderOrderFlow(ctx, sub, tx, top, ph, CW, bw){
 if(!showOrderFlow) return;
 const of = _calcOrderFlow(sub);
 if(!of.length) return;

 const maxAbs = Math.max(...of.map(d=>Math.abs(d.delta)), 1);
 const midY = top + ph*0.42; // zero line slightly above center (more room for negatives)
 const posH = midY - top - 4;   // space above zero line
 const negH = top + ph - midY - 4; // space below zero line
 const n = of.length;

 ctx.save();

 // Background
 ctx.fillStyle='rgba(4,7,16,0.75)';
 ctx.fillRect(0,top,CW,ph);

 // Grid lines at 25%, 50%, 75%
 [0.25,0.5,0.75,1.0].forEach(f=>{
  const py=midY-posH*f;
  const ny=midY+negH*f;
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(CW,py);ctx.stroke();
  if(f<1){ctx.beginPath();ctx.moveTo(0,ny);ctx.lineTo(CW,ny);ctx.stroke();}
 });

 // Zero line — stronger
 ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(0,midY);ctx.lineTo(CW,midY);ctx.stroke();

 // Find threshold for label display (top 30% bars)
 const sortedAbs=[...of.map(d=>Math.abs(d.delta))].sort((a,b)=>b-a);
 const labelThreshold=sortedAbs[Math.max(0,Math.floor(n*0.08))]||maxAbs*0.7; // top 8% only

 // Delta bars with + / - labels
 const barW=Math.max(1,bw-0.5);
 of.forEach((d,i)=>{
  const x=tx(i)-bw/2;
  const absD=Math.abs(d.delta);
  const isPos=d.delta>=0;

  // Bar height proportional, capped at available space
  const barH=isPos
   ? Math.min(posH, absD/maxAbs*posH)
   : Math.min(negH, absD/maxAbs*negH);

  // Color intensity based on strength
  const strength=absD/maxAbs;
  if(isPos){
   const alpha=0.35+strength*0.6;
   ctx.fillStyle=`rgba(34,197,94,${alpha})`;
   ctx.fillRect(x,midY-barH,barW,barH);
   // Top border line for strong bars
   if(strength>0.4){
    ctx.fillStyle=`rgba(34,197,94,${Math.min(1,alpha+0.3)})`;
    ctx.fillRect(x,midY-barH,barW,1.5);
   }
  } else {

 // Volume Profile (TPO method: distributes volume across Hi-Lo range per candle)
 if(hasInd('VP')&&sub.length>0){
  const VP_W=Math.min(80,Math.round(CW*0.10));
  const VP_X=CW-VP_W-1;
  const BINS=40;
  const priceRange=mx-mn||0.01;
  const binSize=priceRange/BINS;
  const binsUp=new Float64Array(BINS);
  const binsDn=new Float64Array(BINS);
  // Distribute each candle's volume across its Hi-Lo range (TPO method)
  sub.forEach(d=>{
   const loB=Math.max(0,Math.min(BINS-1,Math.floor((d.lo-mn)/binSize)));
   const hiB=Math.max(0,Math.min(BINS-1,Math.floor((d.hi-mn)/binSize)));
   const span=Math.max(1,hiB-loB+1);
   const volPerBin=d.v/span;
   const isUp=d.c>=d.o;
   for(let b=loB;b<=hiB&&b<BINS;b++){
    if(isUp)binsUp[b]+=volPerBin;
    else binsDn[b]+=volPerBin;
   }
  });
  const binsTotal=binsUp.map((v,i)=>v+binsDn[i]);
  const maxBin=Math.max(...binsTotal)||1;
  const totalVol=binsTotal.reduce((s,v)=>s+v,0);
  // Value Area (70% of volume around POC)
  const pocIdx=binsTotal.indexOf(maxBin);
  let vaVol=binsTotal[pocIdx],vaLo=pocIdx,vaHi=pocIdx;
  const VA_PCT=0.70;
  while(vaVol<totalVol*VA_PCT&&(vaLo>0||vaHi<BINS-1)){
   const downVol=vaLo>0?binsTotal[vaLo-1]:0;
   const upVol=vaHi<BINS-1?binsTotal[vaHi+1]:0;
   if(upVol>=downVol&&vaHi<BINS-1){vaHi++;vaVol+=binsTotal[vaHi];}
   else if(vaLo>0){vaLo--;vaVol+=binsTotal[vaLo];}
   else break;
  }
  // Background
  ctx.fillStyle=darkTheme?'rgba(4,7,14,0.55)':'rgba(240,244,250,0.7)';
  ctx.fillRect(VP_X,cTop,VP_W+1,cH);
  // Bars
  for(let i=0;i<BINS;i++){
   const vol=binsTotal[i];if(!vol)continue;
   const barW=Math.max(1,Math.round((vol/maxBin)*(VP_W-2)));
   const barY=Math.round(cTop+cH-((i+1)/BINS)*cH);
   const barH=Math.max(1,Math.round(cH/BINS)-0.5);
   const isPOC=i===pocIdx;
   const inVA=i>=vaLo&&i<=vaHi;
   const upFrac=binsUp[i]/(vol||1);
   const dnFrac=1-upFrac;
   // Split bar into buy (green) and sell (red)
   const upW=Math.round(barW*upFrac),dnW=barW-upW;
   ctx.fillStyle=isPOC?'#f59e0b':inVA?'rgba(59,158,255,0.55)':'rgba(59,158,255,0.25)';
   ctx.fillRect(VP_X+VP_W-barW,barY,barW,barH);
   // Green portion on top
   if(upW>0){ctx.fillStyle=isPOC?'#fbbf24':'rgba(34,197,94,0.6)';ctx.fillRect(VP_X+VP_W-barW,barY,upW,barH);}
   // Red portion
   if(dnW>0){ctx.fillStyle=isPOC?'#f59e0b':'rgba(239,68,68,0.5)';ctx.fillRect(VP_X+VP_W-barW+upW,barY,dnW,barH);}
  }
  // Value Area shading on price axis
  const vaLoY=Math.round(cTop+cH-(vaHi+1)/BINS*cH);
  const vaHiY=Math.round(cTop+cH-vaLo/BINS*cH);
  ctx.fillStyle='rgba(59,158,255,0.05)';
  ctx.fillRect(0,vaLoY,VP_X,vaHiY-vaLoY);
  // POC line across full chart
  const pocPrice=mn+(pocIdx+0.5)*binSize;
  const pocY=ty(pocPrice);
  ctx.strokeStyle='#f59e0b';ctx.lineWidth=1.2;ctx.setLineDash([6,3]);
  ctx.beginPath();ctx.moveTo(0,pocY);ctx.lineTo(VP_X,pocY);ctx.stroke();
  ctx.setLineDash([]);
  // VAL / VAH lines
  const valPrice=mn+(vaLo+0.5)*binSize;
  const vahPrice=mn+(vaHi+0.5)*binSize;
  ctx.strokeStyle='rgba(59,158,255,0.5)';ctx.lineWidth=0.7;ctx.setLineDash([3,3]);
  [valPrice,vahPrice].forEach(p=>{
   const y=ty(p);
   ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(VP_X,y);ctx.stroke();
  });
  ctx.setLineDash([]);
  // Labels
  ctx.fillStyle='#f59e0b';ctx.font='bold 7px monospace';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('POC '+pocPrice.toFixed(2),4,pocY);
  ctx.fillStyle='rgba(59,158,255,0.8)';ctx.font='6.5px monospace';

  ctx.fillText('VAL '+valPrice.toFixed(2),4,ty(valPrice));
  ctx.textBaseline='alphabetic';
  // Border
  ctx.strokeStyle='rgba(59,158,255,0.15)';ctx.lineWidth=0.5;

  const _tr=allC.map((_,j)=>j===0?allH[j]-allL[j]:

  const visHi=Math.max(...sub.map(d=>d.hi));
  const visLo=Math.min(...sub.map(d=>d.lo));

  // ── STEP 1: Detect impulse moves ──────────────
  // An impulse = candle with body > 0.4×ATR
  // Its ORIGIN ZONE = the candle(s) immediately before it that were "basing"
  const rawZones=[];
  for(let gi=2;gi<_N-1;gi++){
    const d=all[gi];
    const atr=_atr[gi]||0.001;
    const body=Math.abs(d.c-d.o);
    if(body<atr*0.4)continue; // not an impulse

    const isBull=d.c>d.o;

    // Origin = 1 candle before impulse (the base)
    // Use only 1 candle to keep zone tight and clean
    const base=all[gi-1];
    const zHi=base.hi;
    const zLo=base.lo;
    const zW=zHi-zLo;

    // Zone must be a valid small range (0.05–1.0×ATR)
    if(zW<atr*0.05||zW>atr*1.0||zHi<=zLo)continue;

    // Zone type: bullish impulse = demand BELOW, bearish = supply ABOVE
    const type=isBull?'D':'S';

    // Tested: did price come back to this zone after it formed?
    let tested=false;
    for(let j=gi+1;j<_N;j++){
      if(all[j].c>zLo&&all[j].c<zHi){tested=true;break;}
    }

    rawZones.push({hi:zHi,lo:zLo,mid:(zHi+zLo)/2,type,gi,tested,
      strength:Math.min(9.9,+(body/atr).toFixed(1))});
  }

  // ── STEP 2: Deduplicate by price level ────────
  // Keep only the MOST RECENT zone at each price cluster (0.4×ATR gap)
  const dedupZones=[];
  // Process most recent first
  for(let i=rawZones.length-1;i>=0;i--){
    const z=rawZones[i];
    const exists=dedupZones.some(o=>o.type===z.type&&
      Math.abs(o.mid-z.mid)<atrNow*0.4);
    if(!exists)dedupZones.push(z);
  }

  // ── STEP 3: Filter to visible price range ──────
  const visZones=dedupZones.filter(z=>
    z.hi>visLo&&z.lo<visHi // overlaps visible range
  );

  // ── STEP 4: Pick top 3 demand + 3 supply ───────
  const topD=visZones.filter(z=>z.type==='D')
    .sort((a,b)=>(!a.tested&&b.tested?-1:a.tested&&!b.tested?1:0)||
      Math.abs(a.mid-curPrice)-Math.abs(b.mid-curPrice))
    .slice(0,3);
  const topS=visZones.filter(z=>z.type==='S')

   // Clamp bands so they don't whipsaw
   if(prevUpper!==null) upper=Math.min(upper,prevUpper);
   if(prevLower!==null) lower=Math.max(lower,prevLower);
   // Determine trend
   let t=prevTrend;

// TAP-TAP + DRAG DRAWING ENGINE
// 

// Drawing phases: 0=idle, 1=waiting for p2 (tap1 done), 2=drawing (drag active)
let drawPhase = 0;

function isPatternTool(t){return !!(t&&PATTERN_PTS[t]);}


// ── Magnet / Snap to OHLC ──────────────────────────────
let magnetMode = true; // on by default
const MAGNET_RADIUS = 18; // pixels

function snapPt(pt) {
 if(!magnetMode || !state.tool) return pt;
 const b = chartBounds();
 if(pt.x < 0 || pt.x > b.CW || pt.y < b.cTop || pt.y > b.cBot) return pt;
 const all = state.allCandles;
 if(!all.length) return pt;
 const VIS = Math.min(Math.max(8, state.visible), all.length);
 const maxOff = Math.max(0, all.length - VIS);
 const off = Math.min(maxOff, Math.max(0, state.offset));
 const end = all.length - off, start = Math.max(0, end - VIS);
 const sub = all.slice(start, end), n = sub.length;
 if(!n) return pt;
 const drawW = b.CW - b.bw*2 - 16;
 const tx = i => b.bw + (n<=1 ? drawW/2 : (i/(n-1))*(drawW-b.bw));
 // Price range (linear only for snap)
 const pp = sub.flatMap(d=>[d.hi,d.lo]);
 const rawMn=Math.min(...pp), rawMx=Math.max(...pp), pad=(rawMx-rawMn)*0.06;
 const mid=(rawMn+rawMx)/2;
 const halfRng=((rawMx-rawMn)*0.5+pad)/Math.max(0.1,yScale);
 const mn=mid-halfRng, rng=(mid+halfRng-mn)||1;
 const cH = b.cBot - b.cTop;
 const ty = v => b.cTop + cH - ((v - mn) / rng) * cH;
 // Find nearest candle
 let bestDist = MAGNET_RADIUS * MAGNET_RADIUS;
 let snapX = pt.x, snapY = pt.y;
 sub.forEach((d, i) => {
  const cx = tx(i);
  const dx = pt.x - cx;
  if(Math.abs(dx) > MAGNET_RADIUS * 1.5) return; // skip far candles
  [d.o, d.hi, d.lo, d.c].forEach(price => {
   const cy = ty(price);
   const dist = dx*dx + (pt.y-cy)*(pt.y-cy);
   if(dist < bestDist) {
    bestDist = dist;
    snapX = cx;
    snapY = cy;
   }
  });
 });
 return {x: snapX, y: snapY};
}

function _enrichDrawing(d){
  try{
    const all=state.allCandles;
    const n=all.length;
    if(!n)return;
    const VIS=Math.min(Math.max(8,state.visible),n);
    const maxOff=Math.max(0,n-VIS);
    const clampOff=Math.min(maxOff,Math.max(0,state.offset));
    const end2=n-clampOff;
    const start=Math.max(0,end2-VIS);
    const _subLen=end2-start;
    const sub=all.slice(start,end2);
    if(!sub.length)return;
    const b=chartBounds(_subLen);
    const px2idx=(px)=>Math.round(b.px2idx(px));
    const pp=sub.flatMap(c=>[c.hi,c.lo]).filter(v=>v!=null && isFinite(v) && v>0);
    const rawMn=pp.length?Math.min(...pp):0,rawMx=pp.length?Math.max(...pp):1;
    const pad=(rawMx-rawMn)*0.06;
    const mid=(rawMn+rawMx)/2;
    const halfRng=((rawMx-rawMn)*0.5+pad)/Math.max(0.1,yScale);
    const mn=mid-halfRng;
    const mx=mid+halfRng;
    const rng=mx-mn||1;
    const cH=b.cBot-b.cTop;
    const py2price=(py)=>mn+((b.cBot-py)/cH)*rng;
    if(d.p1){
      const ci=Math.max(0,Math.min(_subLen-1,px2idx(d.p1.x)));
      d._p1_price=py2price(d.p1.y);
      d._p1_idx=start+ci;
    }
    if(d.p2){
      const ci=Math.max(0,Math.min(_subLen-1,px2idx(d.p2.x)));
      d._p2_price=py2price(d.p2.y);
      d._p2_idx=start+ci;
    }
  }catch(e){}
}

  let key;
  if(mode==='1W'){
   // مفتاح الأسبوع: السنة + رقم الأسبوع (ISO تقريبي)
   const onejan=new Date(dt.getFullYear(),0,1);
   const week=Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7);
   key=dt.getFullYear()+'-W'+week;
  } else {
   key=dt.getFullYear()+'-'+dt.getMonth();
  }
  if(!groups[key]){ groups[key]=[]; order.push(key); }
  groups[key].push(c);
 });
 return order.map(k=>{
  const g=groups[k];
  return {
   o:  g[0].o,
   c:  g[g.length-1].c,
   hi: Math.max(...g.map(x=>x.hi)),
   lo: Math.min(...g.map(x=>x.lo)),
   v:  g.reduce((s,x)=>s+(x.v||0),0),
   t:  g[g.length-1].t
  };
 });
}

let _liveTimer = null;

function _startLiveTicker(){
  _stopLiveTicker();

    API_CONFIG.wsConnect(tick => _applyTick(tick));
  } else if(API_CONFIG.endpoints.ticker){

  }
}


function _stopLiveTicker(){

async function _pollLivePrice(){
  if(!API_CONFIG.enabled || !API_CONFIG.endpoints.ticker) return;
const raw = await API_CONFIG.fetch('ticker', {symbol: state.stk.sym});

if(!raw) return;

  // Normalize tick: accept {price/last/close/c, volume/v, change/ch, changePct/pct}
  const tick = {
    c:   +(raw.price || raw.last || raw.close || raw.c || raw.lastTradedPrice || raw.ltp || 0),
    v:   +(raw.volume || raw.vol || raw.v || 0),
    ch:  +(raw.change || raw.ch || 0),
    pct: +(raw.changePct || raw.changePercent || raw.pct || 0),
  };

  if(tick.c > 0) { _applyTick(tick); invalidateChart(); render(); }
}


function _applyTick(tick){
  if(!tick || !tick.c || tick.c <= 0) return;
  const prev = state.stk.p;
  state.stk.p = tick.c;
  if(tick.ch !== undefined) state.stk.ch = tick.ch;
  if(tick.pct !== undefined) state.stk.pct = tick.pct;

  // Update last candle with new price
  if(state.allCandles.length > 0){
    const last = state.allCandles[state.allCandles.length - 1];
    const lastDate = last.t instanceof Date ? last.t : new Date(last.t);
    const today = new Date();
    const isSameDay = lastDate.getFullYear()===today.getFullYear() &&
                       lastDate.getMonth()===today.getMonth() &&
                       lastDate.getDate()===today.getDate();

    if(isSameDay){
      // شمعة اليوم فعلاً — حدّثها عادي
      last.c = tick.c;
      last.hi = Math.max(last.hi, tick.c);
      last.lo = Math.min(last.lo, tick.c);
      if(tick.v) last.v = tick.v;
    } else {
      // آخر شمعة قديمة (بيانات 5Y/الكل غير محدّثة حتى اليوم)
      // افتتاح شمعة اليوم الجديدة: نستخدم إغلاق آخر شمعة كسعر افتتاح
      // (أدق من افتراض o=hi=lo=c، ويمنع ظهور الشمعة كخط رفيع بلا جسم)
      const prevClose = last.c;
      const openPrice = prevClose>0 ? prevClose : tick.c;
      state.allCandles.push({
        o: openPrice,
        hi: Math.max(openPrice, tick.c),
        lo: Math.min(openPrice, tick.c),
        c: tick.c,
        v: tick.v || 0,
        t: today
      });
      state.offset=0;
    }
  }
 

  // Update header price display
  const pEl = document.getElementById('pmain');
  if(pEl){
    pEl.textContent = tick.c.toFixed(2);
    const up = tick.c >= prev;
    pEl.style.color = up ? '#22c55e' : '#ef4444';
    setTimeout(()=>pEl.style.color='', 600);
  }
  const up = (tick.pct || tick.ch || 0) >= 0;
  const chEl = document.getElementById('pch');
  const pctEl = document.getElementById('ppct');
  if(chEl) { chEl.textContent=(up?'+':'')+Math.abs(tick.ch||0).toFixed(2); chEl.style.color=up?'#22c55e':'#ef4444'; }
  // احسب النسبة المئوية يدوياً من (التغيّر / الإغلاق السابق الحقيقي) كاحتياطي
  // نعتمد على state.stk.prevClose أو state.stk.close كمصدر موثوق، بدل prev المحلي
  let pctVal = tick.pct;
  if(!pctVal){
   const realPrev = state.stk?.prevClose || state.stk?.close || (tick.c - (tick.ch||0));
   if(realPrev>0){
    const chVal = tick.ch!=null ? tick.ch : (tick.c - realPrev);
    pctVal = (chVal/realPrev)*100;
   }
  }
  if(pctEl) { pctEl.textContent=(up?'+':'')+Math.abs(pctVal||0).toFixed(2)+'%'; pctEl.style.color=up?'#22c55e':'#ef4444'; }

  invalidateChart();
  render();
}

async function loadStockList(){
  if(!API_CONFIG.enabled || !API_CONFIG.endpoints.stocks) return;
  const raw = await API_CONFIG.fetch('stocks');

  if(!raw || !Array.isArray(raw)) return;
    // تطبيع قائمة شركات سهمك — الحقول: symbol, name_ar, name_en, market, status
    // استبعاد صناديق الريت وحقوق الأولوية من قائمة الشارت
  const _isReitOrRights=(s)=>{
   const ar=' '+(s.name_ar||'')+' ';
   const en=(s.name_en||'').toLowerCase();
   // ريت ككلمة منفصلة (يتجنّب "ريتيل") أو REIT بالإنجليزية
   const isReit=/\sريت\s/.test(ar) || /\breit\b/.test(en);
   // حقوق الأولوية: "حقوق" أو "أولوية" بالعربية، rights بالإنجليزية
   const isRights=/حقوق|أولوية|اولوية/.test(ar) || /\brights?\b/.test(en);
   return isReit || isRights;
  };
  const normalized = raw
    .filter(s=>s.status!=='suspended' && (s.symbol||s.sym) && !_isReitOrRights(s))
    .map(s=>({
      sym:  s.symbol || s.sym || '',
      name: s.name_ar || s.nameAr || s.name || s.name_en || s.symbol || '',
      name_en: s.name_en || '',
      sec:  s.sector || s.market || 'عام',
      p:    0, ch:0, pct:0, // الأسعار تأتي عند فتح السهم عبر loadStk
    }))
    .filter(s=>s.sym);
  if(normalized.length > 0){ 
    // Merge with STOCKS array (API takes priority)
    normalized.forEach(ns=>{
      const existing = STOCKS.findIndex(s=>s.sym===ns.sym);
      if(existing>=0) STOCKS[existing]={...STOCKS[existing],...ns};
      else STOCKS.push(ns);
    });
    // Refresh stock list UI if open
    if(typeof buildStkList==='function' && openSht==='stock') buildStkList();
  }
}

function _buildAlertShortcuts(){
  const el=document.getElementById('alert-shortcuts');
  if(!el)return;
  // Use last traded price from candles (most accurate)
  const all=state.allCandles;
  const lastPrice=all&&all.length?all[all.length-1].c:state.stk.p;
  const opts=[
    {pct:+0.5},{pct:+1},{pct:+2},{pct:+3},{pct:+5},
    {pct:-0.5},{pct:-1},{pct:-2},{pct:-3},{pct:-5},
  ];
  el.innerHTML=opts.map(({pct})=>{
    const targetPrice=+(lastPrice*(1+pct/100)).toFixed(2);
    const diff=+(targetPrice-lastPrice).toFixed(2);
    const isUp=pct>0;
    const type=isUp?'above':'below';
    const clr=isUp?'34,197,94':'239,68,68';

 try{

   const tf=API_CONFIG.tfMap[state.per]||state.per;
   const PER_COUNT={'1m':200,'5m':180,'15m':160,'30m':150,'1H':140,'4H':130,'1D':130,'1W':104,'1M':96};
   const raw=await API_CONFIG.fetch('candles',{symbol:sym,interval:tf,limit:PER_COUNT[state.per]||130});

// Called from render() to draw comparison overlay
function _drawCompareOverlay(ctx,sub,tx,ty,cTop,cH,CW,mn,mx,darkTheme){
 if(!_compareMode||!_compareData.length)return;
 const total=state.allCandles.length;
 const vis=state.visible;
 const off=state.offset;
 const start=Math.max(0,total-vis-off);
 const compSub=_compareData.slice(start,start+sub.length);
 if(compSub.length<2)return;
 // Normalize comparison to % change from first visible bar
 const baseMain=sub[0].c||1;
 const baseComp=compSub[0].c||1;
 ctx.save();
 ctx.beginPath();ctx.rect(0,cTop,CW,cH);ctx.clip();
 ctx.strokeStyle='rgba(251,191,36,0.75)';ctx.lineWidth=1.4;ctx.setLineDash([]);
 ctx.beginPath();let ff=true;
 compSub.forEach((d,i)=>{
  const pctChg=(d.c-baseComp)/baseComp;
  const mappedPrice=baseMain*(1+pctChg);
  const y=ty(mappedPrice);
  ff?(ctx.moveTo(tx(i),y),ff=false):ctx.lineTo(tx(i),y);
 });
 ctx.stroke();
 // Label at end
 const lastComp=compSub[compSub.length-1];
 const lastMain=sub[sub.length-1];
 const compPct=((lastComp.c-baseComp)/baseComp*100).toFixed(2);
 const mainPct=((lastMain.c-baseMain)/baseMain*100).toFixed(2);
 const mappedLast=baseMain*(1+(lastComp.c-baseComp)/baseComp);
 const ly=ty(mappedLast);
 if(ly>cTop+4&&ly<cTop+cH-4){
  ctx.fillStyle='rgba(251,191,36,0.9)';ctx.font='bold 8px Cairo,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.fillText(_compareStk.name+' '+compPct+'%',CW-6,ly);ctx.textBaseline='alphabetic';
 }
 // Legend top-left
 ctx.font='bold 9px Cairo,sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
 const mainCol=parseFloat(mainPct)>=0?'#22c55e':'#ef4444';
 const compCol=parseFloat(compPct)>=0?'#22c55e':'#ef4444';
 ctx.fillStyle='rgba(6,10,22,0.8)';ctx.beginPath();ctx.roundRect(4,cTop+4,130,36,6);ctx.fill();
 ctx.fillStyle='#e0eaf8';ctx.fillText(state.stk.name,8,cTop+8);
 ctx.fillStyle=mainCol;ctx.fillText(mainPct+'%',8,cTop+20);
 ctx.fillStyle='#fbbf24';ctx.fillText('━',60,cTop+8);
 ctx.fillStyle='#e0eaf8';ctx.fillText(_compareStk.name,72,cTop+8);
 ctx.fillStyle=compCol;ctx.fillText(compPct+'%',72,cTop+20);
 ctx.textBaseline='alphabetic';
 ctx.restore();
}

function _recalcDrawingCoords(){
  // Convert stored price/index coords back to pixels after loading
  // Only needed after page reload when p1.x/y are 0
  if(!state.allCandles||!state.allCandles.length)return;
  const all=state.allCandles;
  const n=all.length;
  const vis=state.visible,off=state.offset;
  const start=Math.max(0,n-vis-off);
  const sub=all.slice(start,n-off);
  if(!sub.length)return;
  // Compute chart bounds same as render
  const W=cv.offsetWidth-38||352;
  const H=cv.offsetHeight||748;
const pp=sub.flatMap(d=>[d.hi,d.lo]).filter(v=>v!=null&&isFinite(v)&&v>0);
    const rawMn=pp.length?Math.min(...pp):0,rawMx=pp.length?Math.max(...pp):1;
  const pad=(rawMx-rawMn)*0.06;
  const mn=rawMn-pad,rng=(rawMx-rawMn+pad*2)||1;
  const bw=Math.max(1.5,(W/Math.max(1,vis))*0.72);
  const drawW=W-bw*2-16;
  const VOL_H=Math.round((H-22-3)*0.11);
  const hasSub=['RSI','MACD','STOCH','STOCHRSI','OBV','MFI','ADX','ATR','STD'].some(id=>state.inds.includes(id));
  const SUB_H=hasSub?Math.round(H*0.25):0;
  const cH=H-22-3-VOL_H-(hasSub?SUB_H+3:0)-12-3;
  const cTop=12;
  const ty2=v=>cTop+cH-((v-mn)/rng)*cH;
  const tx2=i=>bw+(sub.length<=1?drawW/2:(i/(sub.length-1))*(drawW));

  state.drawings.forEach(d=>{
    if(!d._p1_price||d._ai)return;
    // Only recalc if pixels are 0,0 (freshly loaded)
    if(d.p1&&d.p1.x===0&&d.p1.y===0){
      const ci1=Math.max(0,Math.min(sub.length-1,d._p1_idx-start));
      if(d.tool==='hline'){
        d.p1.y=ty2(d._p1_price);
        d.p2={x:W,y:d.p1.y};
      } else if(d.tool==='vline'){
        d.p1.x=tx2(ci1);
        d.p2={x:d.p1.x,y:H};
      } else {
        d.p1.x=tx2(ci1);d.p1.y=ty2(d._p1_price);
        if(d.p2&&d._p2_price!=null){
          const ci2=Math.max(0,Math.min(sub.length-1,d._p2_idx-start));
          d.p2.x=tx2(ci2);d.p2.y=ty2(d._p2_price);
        }
      }
    }
  });
}

// Check multi-alerts in render loop
function _checkMultiAlerts(sub,ind){
 if(!state.alerts||!sub.length)return;
 const last=sub[sub.length-1];
 const prev=sub[sub.length-2]||last;
 const rsiLast=ind.rsi?.[ind.rsi.length-1];
 const macdLast=ind.macd?.hist?.[ind.macd.hist.length-1];
 const bbUp=ind.bb?.[ind.bb.length-1]?.up;
 const bbDn=ind.bb?.[ind.bb.length-1]?.dn;
 const adxLast=ind.adx?.[ind.adx.length-1]?.adx;
 const pctChg=prev.c?((last.c-prev.c)/prev.c*100):0;
 const getVal=(type)=>{
  switch(type){
   case 'price': return last.c;
   case 'rsi': return rsiLast;
   case 'macd_hist': return macdLast;
   case 'volume': return last.v;
   case 'bb_upper': return bbUp;
   case 'bb_lower': return bbDn;
   case 'adx': return adxLast;
   case 'pct_change': return pctChg;
   default: return null;
  }
 };
 const prevGetVal=(type)=>{
  switch(type){
   case 'price': return prev.c;
   case 'rsi': return ind.rsi?.[ind.rsi.length-2];
   case 'macd_hist': return ind.macd?.hist?.[ind.macd.hist.length-2];
   default: return getVal(type);
  }
 };
 const checkCond=(c)=>{
  const v=getVal(c.type);const pv=prevGetVal(c.type);
  if(v==null)return false;
  switch(c.op){
   case 'above': return v>c.value;
   case 'below': return v<c.value;
   case 'cross_up': return pv!=null&&pv<=c.value&&v>c.value;
   case 'cross_dn': return pv!=null&&pv>=c.value&&v<c.value;
   default: return false;
  }
 };
 state.alerts.forEach(a=>{
  if(!a.active||a.fired)return;
  const results=a.conditions.map(c=>checkCond(c));
  const triggered=a.logic==='AND'?results.every(Boolean):results.some(Boolean);
  if(triggered){
   a.fired=true;a.active=false;
   // Sound + notification
   try{
        const ac=getAudioContext();if(ac){

        const osc=ac.createOscillator();const gain=ac.createGain();
        osc.connect(gain);gain.connect(ac.destination);
        osc.frequency.setValueAtTime(660,ac.currentTime);

        osc.frequency.exponentialRampToValueAtTime(990,ac.currentTime+0.3);

        gain.gain.setValueAtTime(0.4,ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.8);
        osc.start(ac.currentTime);osc.stop(ac.currentTime+0.8);
        }
      }catch(e){}

   const t=document.getElementById('toast');
   if(t){t.textContent='🔔 تنبيه: '+a.name;t.style.display='block';t.classList.add('show');setTimeout(()=>{t.classList.remove('show');t.style.display='none';},4000);}
  }
 });
}
