<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C1B"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE870"/>
      <stop offset="40%" stop-color="#F0A800"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="40%" stop-color="#CC8800"/>
      <stop offset="100%" stop-color="#664400"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="40%" stop-color="#E0A000"/>
      <stop offset="100%" stop-color="#886000"/>
    </linearGradient>
    <linearGradient id="gt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="50%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="ga" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0.01"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#C89000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C89000" stop-opacity="0"/>
    </radialGradient>
    <filter id="gf">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="200" fill="url(#glow)"/>

  <!-- شبكة -->
  <g opacity="0.12" stroke="#D4A017" stroke-width="1">
    <line x1="75" y1="200" x2="949" y2="200"/>
    <line x1="75" y1="320" x2="949" y2="320"/>
    <line x1="75" y1="440" x2="949" y2="440"/>
    <line x1="75" y1="560" x2="949" y2="560"/>
    <line x1="75" y1="680" x2="949" y2="680"/>
  </g>

  <!-- أعمدة ذهبية -->
  <rect x="75"  y="600" width="84" height="195" rx="8" fill="url(#g2)"/>
  <rect x="187" y="488" width="84" height="307" rx="8" fill="url(#g1)"/>
  <rect x="299" y="375" width="84" height="420" rx="8" fill="url(#g3)"/>
  <rect x="411" y="448" width="84" height="347" rx="8" fill="url(#g1)"/>
  <rect x="523" y="282" width="84" height="513" rx="8" fill="url(#g3)"/>
  <rect x="635" y="352" width="84" height="443" rx="8" fill="url(#g2)"/>
  <rect x="747" y="198" width="84" height="597" rx="8" fill="url(#g1)"/>

  <!-- مساحة خضراء -->
  <polygon points="75,610 190,545 318,352 440,488 558,265 672,392 865,178 865,795 75,795" fill="url(#ga)"/>

  <!-- خط الشارت -->
  <polyline points="75,610 190,545 318,352 440,488 558,265 672,392 865,178"
    fill="none" stroke="#00E676" stroke-width="5" stroke-opacity="0.35"
    stroke-linecap="round" stroke-linejoin="round" filter="url(#gf)"/>
  <polyline points="75,610 190,545 318,352 440,488 558,265 672,392 865,178"
    fill="none" stroke="#00F07A" stroke-width="11"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- نقاط -->
  <circle cx="318" cy="352" r="20" fill="#00F07A" filter="url(#gf)"/>
  <circle cx="318" cy="352" r="9" fill="white"/>
  <circle cx="558" cy="265" r="24" fill="#00F07A" filter="url(#gf)"/>
  <circle cx="558" cy="265" r="11" fill="white"/>
  <circle cx="865" cy="178" r="28" fill="#00F07A" filter="url(#gf)"/>
  <circle cx="865" cy="178" r="13" fill="white"/>

  <!-- سهم -->
  <polygon points="865,105 832,162 898,162" fill="#00F07A" filter="url(#gf)"/>

  <!-- فاصل -->
  <line x1="100" y1="840" x2="924" y2="840" stroke="url(#gt)" stroke-width="1.5" opacity="0.4"/>

  <!-- نص صغير -->
  <text x="512" y="822" text-anchor="middle" font-family="Arial" font-size="30" letter-spacing="8" fill="#C89000" opacity="0.5">AI · SAUDI MARKET</text>

  <!-- نص رئيسي -->
  <text x="512" y="950" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="102" font-weight="900" letter-spacing="-2" fill="url(#gt)">TADAWUL+</text>

  <!-- إطار -->
  <rect width="1024" height="1024" rx="200" fill="none" stroke="#D4A017" stroke-width="3" opacity="0.25"/>
</svg>
 